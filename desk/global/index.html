<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global · Markets Desk</title>
<meta name="description" content="Brent, gold, the dollar index and Bitcoin, each with why it matters for Egypt, and gold prices in Egypt.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,600&display=swap">
<script>try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<link rel="stylesheet" href="/desk/desk.css">
</head>
<body>
<main class="canvas">
  <div class="titlerow"><div>
    <div class="crumbs"><a href="/desk/">Desk</a> / Global</div>
    <h1 id="title">Global</h1>
    <p class="finding" id="finding"></p>
  </div><div class="actions"><span class="samp" data-sample hidden>Sample desk</span></div></div>
  <div class="pages" id="cards"></div>
  <div class="pages" style="margin-top:var(--gap)">
    <section class="card c12">
      <div class="card-h"><h2>Gold in Egypt</h2><div class="seg" id="gseg"></div></div>
      <div class="ctabs" id="gtabs" style="margin-bottom:10px"></div>
      <div class="hero"><span class="lvl num" id="glvl"></span><span class="d num" id="gd"></span><span class="meta" id="gunit"></span></div>
      <div class="gold-grid"><div class="midchart" id="gch" style="height:240px"></div><div id="gkv"></div></div>
      <p class="chart-cap" id="gcap"></p>
      <p class="stock-note">Egyptian gold follows the world price in dollars times the pound's rate, so a weaker pound lifts it even when gold falls abroad.</p>
    </section>

    <section class="card c12">
      <div class="card-h"><h2>News</h2><span class="meta">Checked against the day's research</span></div>
      <div id="news"></div>
    </section>
  </div>
</main>
<script src="/desk/charts.js"></script>
<script src="/desk/desk.js"></script>
<script>
(async () => {
  const M = Desk, D = await M.init('/desk/global/'); if (!D) return;
  const P = D.pages.global, notes = P.notes || {};
  M.$('title').textContent = 'Global · ' + M.dateLine(M.ASOF); document.title = 'Global · Markets Desk';
  M.$('finding').textContent = P.finding;
  const C = [['brent', 'Brent crude', '$ per barrel', 2], ['gold_usd', 'Gold', '$ per ounce', 0], ['dxy', 'Dollar index', 'DXY, against six major currencies', 2], ['btc', 'Bitcoin', '$', 0]];
  M.$('cards').innerHTML = C.map(([k, n, u], i) => `<section class="card c6"><div class="card-h"><h2>${n}</h2><div class="seg" id="seg${i}"></div></div><div class="hero"><span class="lvl num" id="lvl${i}"></span><span class="d num" id="d${i}"></span><span class="meta">${u}</span></div><div class="midchart" id="ch${i}"></div><p class="chart-cap" id="cap${i}"></p><div id="kv${i}" style="margin-top:12px"></div><p class="pvd-read">${M.esc(notes[k] || '')}</p></section>`).join('');
  C.forEach(([k, n, u, dp], i) => {
    const s = M.series((e) => e[k], k === 'btc' ? 'all' : 'us');
    if (!s.length) { M.$('ch' + i).textContent = 'Not logged yet.'; return; }
    M.$('lvl' + i).textContent = M.num(M.last(s), dp);
    const dc = M.change(s, 0); M.$('d' + i).innerHTML = `<span class="${M.cls(dc)}">${M.pct(dc, 2)}</span>`;
    // 1D appears only for items with the last 24 hours saved (desk/intraday.json)
    const has1D = !!(M.INTRA && M.INTRA.global && M.INTRA.global.series[k]);
    const draw = (p) => {
      if (!p[1]) { const c1 = M.dayChart(M.$('ch' + i), 'global', k, n, dp ? Charts.fmt.dec(dp) : Charts.fmt.int); M.$('cap' + i).innerHTML = c1 || ''; return; }
      M.$('cap' + i).innerHTML = '';
      M.chart(M.$('ch' + i), s, p[1], n, dp ? Charts.fmt.dec(dp) : Charts.fmt.int, { xAt: true });
    };
    M.segment(M.$('seg' + i), '1M', draw, has1D ? M.PERIODS : M.PERIODS.slice(1)); draw(M.PERIODS[2]);
    const [lo, hi] = M.range52(s), signed = (c) => `<span class="${M.cls(c)}">${M.pct(c)}</span>`;
    M.$('kv' + i).innerHTML = M.kv([['Month', signed(M.change(s, 30))], ['This year', signed(M.ytd(s))], ['52-week range', `${M.num(lo, dp)} – ${M.num(hi, dp)}`]]);
  });
  // Gold in Egypt: one chart, switched between 24K, 21K, 18K and the gold pound (21K first: the most bought)
  const G = [['gold21_egp', '21K', 'EGP per gram, the most bought'], ['gold24_egp', '24K', 'EGP per gram'], ['gold18_egp', '18K', 'EGP per gram'], ['goldpound_egp', 'Gold pound', 'EGP, 8 grams of 21K']];
  let gi = 0, gp = M.PERIODS[2];
  const drawG = () => {
    const [k, n, unit] = G[gi], s = M.series((e) => e[k], 'all'), signed = (c) => `<span class="${M.cls(c)}">${M.pct(c)}</span>`;
    const dc = M.change(s, 0);
    M.$('glvl').textContent = M.num(M.last(s), 0); M.$('gd').innerHTML = `<span class="${M.cls(dc)}">${M.pct(dc, 2)}</span>`; M.$('gunit').textContent = unit;
    M.chart(M.$('gch'), s, gp[1], `Gold ${n}`, Charts.fmt.int, { xAt: true });
    const c = M.change(s, gp[1]); M.$('gcap').innerHTML = `${gp[2]}: <span class="num ${M.cls(c)}">${M.pct(c, 2)}</span>`;
    const [lo, hi] = M.range52(s);
    M.$('gkv').innerHTML = M.kv([['Day', signed(dc)], ['Week', signed(M.change(s, 7))], ['Month', signed(M.change(s, 30))], ['This year', signed(M.ytd(s))]]) + M.rangeBar(lo, hi, M.last(s), (x) => M.num(x, 0));
  };
  M.$('gtabs').innerHTML = G.map((g, j) => `<button type="button" aria-pressed="${!j}">${g[1]}</button>`).join('');
  M.$('gtabs').querySelectorAll('button').forEach((b, j) => b.addEventListener('click', () => { M.$('gtabs').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b)); gi = j; drawG(); }));
  M.segment(M.$('gseg'), '1M', (p) => { gp = p; drawG(); }, M.PERIODS.slice(1)); drawG();
  M.news(M.$('news'), P.news);
})();
</script>
</body>
</html>
