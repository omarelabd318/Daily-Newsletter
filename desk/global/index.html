<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2352d6b5'/%3E%3Cpath d='M6 22l7-7 5 4 9-11' fill='none' stroke='%230e1216' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Global · Markets Desk</title>
<meta name="description" content="Brent, gold, the dollar index and Bitcoin, each with why it matters for Egypt.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,600&display=swap">
<script>try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<link rel="stylesheet" href="/desk/desk.css">
</head>
<body>
<main class="canvas">
  <div class="titlerow"><div>
    <div class="crumbs"><a href="/desk/">Desk</a> / Global</div>
    <h1 id="title">Global</h1>
    <p class="finding" id="finding"></p>
  </div><div class="actions"><span class="samp" data-sample hidden>Sample desk</span></div></div>
  <div class="pages" id="cards-top" style="margin-bottom:var(--gap)"></div>
  <div class="pages" style="margin-bottom:var(--gap)">
  </div>
  <div class="pages" id="cards"></div>
  <div class="pages" style="margin-top:var(--gap)">

    <section class="card c12">
      <div class="card-h"><h2>News</h2><span class="meta">Checked against the day's research</span></div>
      <div id="news"></div>
    </section>
  </div>
</main>
<script src="/desk/charts.js"></script>
<script src="/desk/tags.js"></script>
<script src="/desk/desk.js"></script>
<script>
(async () => {
  const M = Desk, D = await M.init('/desk/global/'); if (!D) return;
  const P = D.pages.global, notes = P.notes || {};
  M.$('title').textContent = 'Global · ' + M.dateLine(D.date); document.title = 'Global · Markets Desk';
  M.$('finding').textContent = P.finding;
  // Brent and the dollar index on top, then world gold beside Bitcoin (Gold in Egypt is on the EGP page)
  const DAYROW = { brent: /^Brent/, dxy: /^Dollar index/, gold_usd: /^Gold, \$/, btc: /^Bitcoin/ };
  const C = [['brent', 'Brent crude', '$ per barrel', 2], ['dxy', 'Dollar index', 'DXY, against six major currencies', 2], ['gold_usd', 'Gold', '$ per ounce', 0], ['btc', 'Bitcoin', '$', 0]];
  const cardHtml = C.map(([k, n, u], i) => `<section class="card c6"><div class="card-h"><h2>${n}</h2><div class="seg" id="seg${i}"></div></div><div class="hero"><span class="lvl num" id="lvl${i}"></span><span class="d num" id="d${i}"></span><span class="meta">${u}</span></div><div class="midchart" id="ch${i}"></div><p class="chart-cap" id="cap${i}"></p><div id="kv${i}" style="margin-top:12px"></div><p class="pvd-read">${M.esc(notes[k] || '')}</p></section>`).join('');
  M.$('cards-top').innerHTML = cardHtml.split('</section>').slice(0, 2).map((x) => x + '</section>').join('');
  M.$('cards').innerHTML = cardHtml.split('</section>').slice(2, 4).map((x) => x + '</section>').join('');
  const ROLLS = (await M.get('/desk/rolls.json')) || {};
  C.forEach(([k, n, u, dp], i) => {
    const s = M.series((e) => e[k], k === 'btc' ? 'all' : 'us');
    if (!s.length) { M.$('ch' + i).textContent = 'Not logged yet.'; return; }
    M.$('lvl' + i).textContent = M.num(M.last(s), dp);
    const dc = M.change(s, 0); M.$('d' + i).innerHTML = `<span class="${M.cls(dc)}">${M.pct(dc, 2)}</span>`;
    // 1D appears only for items with the last 24 hours saved (desk/intraday.json)
    const has1D = !!(M.INTRA && M.INTRA.global && M.INTRA.global.series[k]);
    let sAll = s;
    const draw = async (p) => {
      M.$('d' + i).innerHTML = M.heroChg(p[1] > 400 ? sAll : s, p);
      if (!p[1]) { const c1 = M.dayChart(M.$('ch' + i), 'global', k, n, dp ? Charts.fmt.dec(dp) : Charts.fmt.int); M.$('cap' + i).innerHTML = c1 || ''; return; }
      if (p[1] > 400) { if (!M.full.done) { await M.full(); M.full.done = true; } sAll = M.series((e) => e[k], k === 'btc' ? 'all' : 'us'); }
      M.$('cap' + i).innerHTML = ''; M.$('d' + i).innerHTML = M.heroChg(sAll, p);
      // Brent: a futures contract switch in view is marked on the chart
      M.chart(M.$('ch' + i), sAll, p[1], n, dp ? Charts.fmt.dec(dp) : Charts.fmt.int, { rolls: (ROLLS[k] || []).filter((r) => r.session >= M.cut(M.lastDate(sAll), 45)) });
      if (p[1] > 400) { const c = M.change(sAll, p[1]); M.$('cap' + i).innerHTML = `${p[2]}: <span class="num ${M.cls(c)}">${M.pct(c, 1)}</span>`; }
    };
    M.segment(M.$('seg' + i), '1M', draw, (has1D ? M.PERIODS : M.PERIODS.slice(1)).concat(M.LONG)); draw(M.PERIODS[2]);
    const [lo, hi] = M.range52(s), signed = (c) => `<span class="${M.cls(c)}">${M.pct(c)}</span>`;
    // the day's move first, so a sharp fall like gold's shows without opening the chart: the desk's confirmed figure
    // from its close card when it has one (it compares like with like when a futures contract rolls), else the log's
    const row = (((D.global || {}).close || {}).groups || []).flatMap((g) => g.rows).find((r) => DAYROW[k].test(r.label));
    const day = row ? (row.change == null ? '<span class="dash" title="Not confirmed by two sources">—</span>' : signed(row.change)) : signed(M.change(s, 0));
    M.$('kv' + i).innerHTML = M.kv([['Day', day], ['Month', signed(M.change(s, 30))], ['This year', signed(M.ytd(s))], ['52-week range', `${M.num(lo, dp)} – ${M.num(hi, dp)}`]]);
  });
  M.news(M.$('news'), P.news);
})();
</script>
</body>
</html>
