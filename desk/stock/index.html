<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2352d6b5'/%3E%3Cpath d='M6 22l7-7 5 4 9-11' fill='none' stroke='%230e1216' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Stocks · Markets Desk</title>
<meta name="description" content="One page per stock: price chart against its index, performance, valuation, trading, dates coming up, the desk's views and news.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,600&display=swap">
<script>try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<link rel="stylesheet" href="/desk/desk.css">
</head>
<body>
<main class="canvas">
  <div class="titlerow"><div>
    <div class="crumbs"><a href="/desk/egypt/" id="deskcrumb">Desk</a> / <a href="/desk/egx/" id="mkt">EGX</a> / <span id="crumb"></span></div>
    <h1 id="name"></h1>
    <p class="finding" id="sub"></p>
  </div><div class="actions"><select class="picker" id="pick" aria-label="Choose a stock"></select><span class="samp" data-sample hidden>Sample desk</span></div></div>

  <div class="pages">
    <section class="card c8">
      <div class="card-h"><div class="hgroup"><h2>Price</h2><div class="ctabs" id="curtog" aria-label="Currency" hidden></div><button type="button" class="cmp" id="cmp" aria-pressed="false"></button></div><div class="seg" id="seg"></div></div>
      <div class="hero"><span class="lvl num" id="lvl"></span><span class="d num" id="dchg"></span><span class="meta" id="cur"></span></div>
      <div class="bigchart" id="chart"></div>
      <p class="chart-cap" id="cap"></p>
    </section>
    <section class="card c4">
      <div class="card-h"><h2>Performance</h2><span class="meta" id="pdate"></span></div>
      <div id="perf"></div>
      <div id="range"></div>
      <p class="sub" id="vsidx" style="margin-top:12px"></p>
    </section>

    <section class="card c4">
      <div class="card-h"><h2>Valuation</h2><span class="meta" id="valmeta"></span></div>
      <div id="val"></div>
      <div class="notice" id="valnote" hidden></div>
    </section>
    <section class="card c4">
      <div class="card-h"><h2>Trading</h2><span class="meta" id="tdate"></span></div>
      <div id="trade"></div>
      <p class="sub" id="tnote" style="margin-top:12px"></p>
    </section>
    <section class="card c4">
      <div class="card-h"><h2>Coming up</h2></div>
      <div id="next"></div>
    </section>

    <!-- the desk's own view, beside the stock's news -->
    <section class="card c4">
      <div class="card-h"><h2>The desk on this stock</h2></div>
      <div id="views"></div>
    </section>
    <section class="card c8">
      <div class="card-h"><h2>In the news</h2><span class="meta">Company news and the day&rsquo;s market news</span></div>
      <div id="news"></div>
    </section>

  </div>
</main>
<script>
// a refresh on a stock's page goes back to its list (Egyptian or US stocks); opening a stock still shows it
try {
  const nav = performance.getEntriesByType('navigation')[0];
  if (nav && nav.type === 'reload') {
    const t = new URLSearchParams(location.search).get('t') || '';
    location.replace(['AAPL', 'MSFT', 'NVDA', 'AMZN', 'GOOGL', 'META', 'TSLA', 'JPM', 'XOM', 'AVGO', 'BRK.B', 'WMT', 'V', 'ORCL', 'COST'].includes(t) ? '/desk/stocks/us/' : '/desk/stocks/egypt/');
  }
} catch (e) {}
</script>
<script src="/desk/charts.js"></script>
<script src="/desk/tags.js"></script>
<script src="/desk/desk.js"></script>
<script>
(async () => {
  const t0 = new URLSearchParams(location.search).get('t') || 'COMI';
  const M = Desk, D = await M.init(Desk.GROUP.us.includes(t0) ? '/desk/stocks/us/' : '/desk/stocks/egypt/'); if (!D) return;
  let t = new URLSearchParams(location.search).get('t') || 'COMI';
  if (!M.NAMES[t]) t = 'COMI';
  const egx = M.GROUP.egx.includes(t), cur = egx ? 'EGP ' : '$';
  const ST = await M.get('/desk/stocks.json'), p = (ST && ST.stocks && ST.stocks[t]) || {};
  const s = M.stock(t); let idxAll = M.series((e) => e[egx ? 'egx30' : 'sp500'], egx ? 'egx' : 'us'); const idxS = M.series((e) => e[egx ? 'egx30' : 'sp500'], egx ? 'egx' : 'us'), idxN = egx ? 'EGX30' : 'S&P 500';
  const dash = '<span class="dash">—</span>', signed = (c) => `<span class="${M.cls(c)}">${M.pct(c)}</span>`;
  M.$('pick').innerHTML = ['egx', 'us'].map((g) => `<optgroup label="${g === 'egx' ? 'Egypt' : 'USA'}">${M.GROUP[g].map((x) => `<option value="${x}"${x === t ? ' selected' : ''}>${M.esc(M.NAMES[x])} (${x})</option>`).join('')}</optgroup>`).join('');
  M.$('pick').addEventListener('change', (e) => { location.search = '?t=' + encodeURIComponent(e.target.value); });
  M.$('crumb').textContent = M.NAMES[t]; M.$('mkt').textContent = egx ? 'EGX stocks' : 'Wall Street stocks'; M.$('mkt').href = egx ? '/desk/stocks/egypt/' : '/desk/stocks/us/'; M.$('deskcrumb').href = egx ? '/desk/egypt/' : '/desk/usa/';
  M.$('name').innerHTML = `${M.esc(M.NAMES[t])} <span class="meta" style="font-size:15px;font-weight:400">${M.esc(t)}${p.sector ? ' · ' + M.esc(p.sector) : ''}</span>`;
  document.title = M.NAMES[t] + ' · Markets Desk';
  const mAsOf = M.asOfFor(egx ? 'egx' : 'us');   // the stock's market's last session (Thursday for the EGX, Friday for Wall Street at weekends)
  const fresh = s.length && s.at(-1)[0] === mAsOf, dc = fresh ? M.change(s, 0) : null, y = M.ytd(s);
  const when = M.day(mAsOf).toLocaleDateString('en-US', { weekday: 'long' });
  const nxt = (p.next || [])[0];
  if (!s.length) { M.$('sub').textContent = `Not trading yet${nxt ? ` · ${nxt.event}: ${nxt.when}. ${nxt.why}` : '.'}`; }
  else M.$('sub').innerHTML = fresh ? `Closed at ${cur}${M.num(M.last(s))} on ${when}, <span class="${M.cls(dc)}">${M.pct(dc)}</span> on the day and <span class="${M.cls(y)}">${M.pct(y)}</span> this year.` : `No close logged for ${when}.`;
  M.$('lvl').textContent = M.num(M.last(s)); M.$('dchg').innerHTML = `<span class="${M.cls(dc)}">${M.pct(dc, 2)}</span>`; M.$('cur').textContent = egx ? 'EGP' : 'USD';
  M.$('pdate').textContent = 'to ' + M.short(mAsOf);
  // the chart in the stock's currency or, for Egyptian stocks, in dollars; 3Y and 5Y load the full log
  // the index's line through the day, for the compare switch: the EGX30 for Egyptian stocks, the S&P 500 for US ones
  const IK = egx ? 'EGX30' : 'sp500', MK = egx ? 'egx' : 'us';
  const dayPair = () => { const E = M.INTRA && M.INTRA[MK], S = E && E.series; return S && S[t] && S[IK] && E.session <= M.asOfFor(MK) ? [S[t], S[IK], E.session] : null; };
  // the week, every 15 minutes, the sessions that have both lines (as the 1W chart draws the stock alone)
  // a week (every 15 minutes) or a month (every 30) of sessions with both lines, once they cover the period
  const weekPair = (back = 7) => M.intraPeriod(MK, [t, IK], back);
  const atTime = (X, tm) => { let v = null; for (const [u, x] of X) { if (u <= tm) v = x; else break; } return v; };
  let sx = s, per = M.startPeriod(egx ? 'egx' : 'us', t), inUSD = false, cmp = false;
  const draw = async () => {
    // 1D against the EGX30: the session's five-minute prices, both from 100 at the first trade
    const dp = !per[1] && cmp ? dayPair() : null;
    if (dp) {
      const [S, X, ses] = dp, xAt = (tm) => atTime(X, tm);
      const pts = S.filter(([tm]) => xAt(tm) != null), b0 = pts.length ? pts[0][1] : null, i0 = pts.length ? xAt(pts[0][0]) : null;
      M.$('lvl').textContent = M.num(M.last(inUSD ? M.usd(sx) : sx)); M.$('cur').textContent = egx && !inUSD ? 'EGP' : 'USD'; M.$('dchg').innerHTML = M.heroChg(inUSD ? M.usd(sx) : sx, per);
      if (pts.length >= 2 && b0 && i0) {
        const a = pts.map(([, x]) => x / b0 * 100), bb = pts.map(([tm]) => xAt(tm) / i0 * 100), el = M.$('chart'); el.innerHTML = '';
        const pad = (Math.max(...a, ...bb) - Math.min(...a, ...bb)) * 0.15 || 0.2;
        const res = Charts.line(el, { ...M.dayAxis(pts.map((x) => x[0]), el.clientWidth), series: [{ name: t, values: a }, { name: idxN, values: bb, muted: true }], format: Charts.fmt.dec(1), endLabel: true, height: el.clientHeight, min: Math.min(...a, ...bb) - pad, max: Math.max(...a, ...bb) + pad });
        const ca = a.at(-1) - 100, cb = bb.at(-1) - 100;
        M.$('cap').innerHTML = `${M.day(ses).toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'short' }).replace('Sept', 'Sep')}, both from 100 at the first trade: ${t} <span class="num ${M.cls(ca)}">${M.pct(ca, 2)}</span>, ${idxN} <span class="num ${M.cls(cb)}">${M.pct(cb, 2)}</span> · ${Math.abs(ca - cb) < 0.05 ? 'level with' : `${M.num(Math.abs(ca - cb), 2)} pts ${ca > cb ? 'ahead of' : 'behind'}`} the index`;
        if (res && res.legend) M.$('cap').prepend(res.legend);
      }
      return;
    }
    if (!per[1]) { M.$('lvl').textContent = M.num(M.last(inUSD ? M.usd(sx) : sx)); M.$('cur').textContent = egx && !inUSD ? 'EGP' : 'USD'; M.$('dchg').innerHTML = M.heroChg(inUSD ? M.usd(sx) : sx, per); const c1 = M.dayChart(M.$('chart'), egx ? 'egx' : 'us', t, t, Charts.fmt.dec(2), egx && inUSD); const d1 = inUSD ? M.change(M.usd(sx), 0) : dc; M.$('cap').innerHTML = c1 ? `${c1} · on the day <span class="num ${M.cls(d1)}">${M.pct(d1, 2)}</span>` : ''; return; }
    if (per[1] > 400 && !M.full.done) { await M.full(); M.full.done = true; sx = M.stock(t); idxAll = M.series((e) => e[egx ? 'egx30' : 'sp500'], egx ? 'egx' : 'us'); return draw(); }
    const v = inUSD ? M.usd(sx) : sx, vi = inUSD ? M.usd(idxAll) : idxAll, unit = inUSD ? ' in dollars' : '';
    // against the index: both lines start at 100 on the period's first close, so the gap is the stock's lead or lag
    const wp = cmp && (per[1] === 7 || per[1] === 30) && !inUSD ? weekPair(per[1]) : null;
    if (wp) {
      const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], labels = [], a0 = [], b0 = [], text = [], at = [];
      const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']; let wk = null;
      wp.forEach((x) => { const d = M.day(x.session), mo = per[1] === 30, dl = mo ? `${MON[d.getMonth()]} ${d.getDate()}` : `${WD[d.getDay()]} ${d.getDate()}`, w = Math.floor((d - M.day('2026-01-04')) / 6048e5);
        if (!mo || w !== wk) at.push(labels.length); wk = w;
        x.series[t].forEach(([tm, v]) => { const iv = atTime(x.series[IK], tm); if (iv == null) return; labels.push(`${dl} ${tm}`); a0.push(v); b0.push(iv); text.push(dl); }); });
      if (per[1] === 30 && at.length > 2 && at[1] - at[0] < (at[2] - at[1]) / 2) at.shift();
      M.$('lvl').textContent = M.num(M.last(sx)); M.$('dchg').innerHTML = M.heroChg(sx, per); M.$('cur').textContent = egx ? 'EGP' : 'USD';
      if (a0.length >= 2) {
        const a = a0.map((x) => x / a0[0] * 100), bb = b0.map((x) => x / b0[0] * 100), el = M.$('chart'); el.innerHTML = '';
        const pad = (Math.max(...a, ...bb) - Math.min(...a, ...bb)) * 0.15 || 0.2;
        const res = Charts.line(el, { labels, xAt: el.clientWidth < 520 && at.length > 3 ? at.filter((_, j) => (at.length - 1 - j) % 2 === 0) : at, xText: text, series: [{ name: t, values: a }, { name: idxN, values: bb, muted: true }], format: Charts.fmt.dec(1), endLabel: true, height: el.clientHeight, min: Math.min(...a, ...bb) - pad, max: Math.max(...a, ...bb) + pad });
        const ca = a.at(-1) - 100, cb = bb.at(-1) - 100;
        M.$('cap').innerHTML = `Last ${wp.length} sessions through the day, both from 100 at the first trade: ${t} <span class="num ${M.cls(ca)}">${M.pct(ca, 1)}</span>, ${idxN} <span class="num ${M.cls(cb)}">${M.pct(cb, 1)}</span> · ${Math.abs(ca - cb) < 0.05 ? 'level with' : `${M.num(Math.abs(ca - cb), 1)} pts ${ca > cb ? 'ahead of' : 'behind'}`} the index`;
        if (res && res.legend) M.$('cap').prepend(res.legend);
        return;
      }
    }
    if (cmp && per[1]) {
      const back = Math.max(per[1], 7), pts = v.filter(([d]) => d >= M.cut(M.lastDate(v), back)), b0 = pts.length ? pts[0][1] : null, i0 = pts.length ? M.valueAt(vi, pts[0][0]) : null;
      M.$('lvl').textContent = M.num(M.last(v)); M.$('dchg').innerHTML = M.heroChg(v, per); M.$('cur').textContent = egx && !inUSD ? 'EGP' : 'USD';
      if (pts.length >= 2 && b0 && i0) {
        const a = pts.map(([, x]) => x / b0 * 100), bb = pts.map(([d]) => (M.valueAt(vi, d) || i0) / i0 * 100), el = M.$('chart'); el.innerHTML = '';
        const pad = (Math.max(...a, ...bb) - Math.min(...a, ...bb)) * 0.15 || 1;
        const res = Charts.line(el, { ...M.axis(pts.map((x) => x[0]), back, el.clientWidth), series: [{ name: t, values: a }, { name: idxN, values: bb, muted: true }], format: Charts.fmt.dec(1), endLabel: true, height: el.clientHeight, marks: pts.length <= 12, min: Math.min(...a, ...bb) - pad, max: Math.max(...a, ...bb) + pad });
        const ca = a.at(-1) - 100, cb = bb.at(-1) - 100;
        M.$('cap').innerHTML = `Both start at 100 on ${M.short(pts[0][0])}${unit}: ${t} <span class="num ${M.cls(ca)}">${M.pct(ca, 1)}</span>, ${idxN} <span class="num ${M.cls(cb)}">${M.pct(cb, 1)}</span> · ${Math.abs(ca - cb) < 0.05 ? 'level with' : `${M.num(Math.abs(ca - cb), 1)} pts ${ca > cb ? 'ahead of' : 'behind'}`} the index`;
        if (res && res.legend) M.$('cap').prepend(res.legend);
      }
      return;
    }
    M.$('lvl').textContent = M.num(M.last(v)); M.$('dchg').innerHTML = M.heroChg(v, per); M.$('cur').textContent = egx && !inUSD ? 'EGP' : 'USD';
    const w1 = per[1] === 7 || per[1] === 30 ? M.weekChart(M.$('chart'), egx ? 'egx' : 'us', t, t, Charts.fmt.dec(2), egx && inUSD, per[1]) : null;
    if (w1) { M.$('lvl').textContent = M.num(M.last(v)); M.$('dchg').innerHTML = M.heroChg(v, per); M.$('cap').innerHTML = `${w1} · ${idxN} in a ${per[1] === 7 ? 'week' : 'month'} <span class="num ${M.cls(M.change(vi, per[1]))}">${M.pct(M.change(vi, per[1]), 2)}</span>`; return; }
    M.chart(M.$('chart'), v, per[1], t + unit, Charts.fmt.dec(2)); const c = M.change(v, per[1]), ci = M.change(vi, per[1]);
    M.$('cap').innerHTML = `${per[2]}${unit}: <span class="num ${M.cls(c)}">${M.pct(c, 2)}</span> · ${idxN} <span class="num ${M.cls(ci)}">${M.pct(ci, 2)}</span>`;
  };
  if (egx) { M.$('curtog').hidden = false; M.toggle(M.$('curtog'), ['EGP', 'USD'], (i) => { inUSD = i === 1; draw(); perfCard(inUSD); }); }
  // the compare switch: on 1D it needs the session's line for both the stock and its index
  const cmpSync = () => { const b = M.$('cmp'), ok = !!per[1] || !!dayPair(); b.textContent = `vs ${idxN}`; b.disabled = !ok; b.title = ok ? `Draw ${idxN} beside the stock, both from 100` : `No one-day line for ${idxN} saved for the last session: pick 1W or longer to compare`; b.setAttribute('aria-pressed', cmp && ok ? 'true' : 'false'); };
  M.$('cmp').addEventListener('click', () => { cmp = !cmp; cmpSync(); draw(); });
  M.segment(M.$('seg'), per[0], (q) => { per = q; cmpSync(); draw(); }, M.PERIODS.concat(M.LONG)); cmpSync(); draw();
  // the stock's move next to its index's over the same period, and the gap between them in percentage points;
  // in dollars (an Egyptian stock with USD picked) both the stock and the EGX30 are divided by each day's dollar rate
  const perfCard = (usd) => {
    const ss = usd ? M.usd(s) : s, ii = usd ? M.usd(idxS) : idxS, yy = M.ytd(ss);
    const vs = (back) => { const a = back == null ? yy : M.change(ss, back), b = back == null ? M.ytd(ii) : M.change(ii, back); return a == null || b == null ? null : a - b; };
    const pts = (v) => v == null ? '<span class="dash">—</span>' : `<span class="${M.cls(v)}">${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v).toFixed(1)} pts</span>`;
    M.$('perf').innerHTML = M.kv([['Week', signed(M.change(ss, 7))], ['Month', signed(M.change(ss, 30))], ['6 months', signed(M.change(ss, 182))], ['Year', signed(M.change(ss, 365))], ['This year', signed(yy)]])
      + `<h3 class="perf-h">Against the ${idxN}${usd ? ', both in dollars' : ''}</h3>` + M.kv([['Month', pts(vs(30))], ['6 months', pts(vs(182))], ['This year', pts(vs(null))]]);
    const [lo, hi] = M.range52(ss); M.$('range').innerHTML = M.rangeBar(lo, hi, M.last(ss));
    M.$('pdate').textContent = 'to ' + M.short(mAsOf) + (usd ? ' · in dollars' : '');
    if (ss.length) M.$('vsidx').innerHTML = `The ${idxN} is <span class="num ${M.cls(M.ytd(ii))}">${M.pct(M.ytd(ii))}</span> this year${usd ? ' in dollars' : ''}; points above zero mean the stock beat it. ${M.num((1 - M.last(ss) / hi) * 100, 1)}% below its 52-week high.`;
  };
  perfCard(false);

  const V = p.valuation, rows = (r) => r.map((x) => [x.label, x.value == null ? dash : M.esc(x.value)]);
  M.$('val').innerHTML = M.kv(V ? rows(V.rows) : [['Market value', dash], ['P/E', dash], ['P/B', dash]]);
  M.$('valmeta').textContent = V ? `${V.source}, ${M.short(V.asOf)}` : 'Not fetched yet';
  // what the figures rest on: the results period behind the ratios (P/E and P/B are worked out at the latest close)
  if (V) {
    const old = V.period ? (M.day(M.ASOF) - M.day(V.period)) / 864e5 : 0, fetched = (M.day(M.ASOF) - M.day(V.asOf)) / 864e5;
    const note = (t) => { M.$('valnote').hidden = false; M.$('valnote').textContent = t; };
    if (fetched > 100) note(`${V.source} last updated these on ${M.day(V.asOf).toLocaleDateString('en-US', { day: 'numeric', month: 'long' })}${V.basis ? ', on ' + V.basis : ''}: too old to rely on.`);
    else if (V.period && old > 200) note(`Based on ${V.basis}, the latest ${V.source} carries; newer results are likely out, so treat the ratios as a guide.`);
    else if (V.period) M.$('valmeta').textContent += ` · ${V.basis.replace(/^results for the 12 months to /, 'earnings to ').replace(/^the four quarters to /, 'earnings to ')}`;
  }
  // volume from the data log: the last session against the average of the 30 before it
  const vs_ = M.series((e) => (e.vol || {})[t], egx ? 'egx' : 'us'), lastV = vs_.length ? vs_.at(-1) : null;
  const prior = vs_.slice(-31, -1).map((x) => x[1]), avg = prior.length >= 10 ? prior.reduce((a, b) => a + b, 0) / prior.length : null;
  const big = (v) => v >= 1e6 ? (v / 1e6).toFixed(2) + 'm' : v >= 1e3 ? (v / 1e3).toFixed(1) + 'k' : String(Math.round(v));
  const vsAvg = lastV && avg ? (lastV[1] / avg - 1) * 100 : null;
  const T = p.trading, extra = T ? T.rows.filter((r) => !/^Volume|30-day/.test(r.label)) : [];
  M.$('trade').innerHTML = M.kv([['Volume', lastV ? big(lastV[1]) + ' shares' : dash], ...rows(extra),
    ['30-session average', avg ? big(avg) + ' shares' : `<span class="dash">${vs_.length} of 10 sessions logged</span>`],
    ['Against the average', vsAvg == null ? dash : `<span class="${M.cls(vsAvg)}">${M.pct(vsAvg, 0)}</span>`]]);
  M.$('tdate').textContent = lastV ? M.short(lastV[0]) : (T ? M.short(T.date) : '');
  M.$('tnote').innerHTML = egx ? 'Volume against its usual level shows when big money is moving. Buying and selling by investor group is only published for the whole market: see the <a href="/desk/egx/">EGX page</a>.' : 'Volume against its usual level shows when big money is moving.';
  // coming up: the calendar's dates for this stock (results, dividends, splits) and the desk's own notes (stocks.json
  // "next"); a dated note that has passed is left out, and the calendar's results date replaces an undated results note
  {
    const CAL = ((await M.get('/desk/calendar.json')) || {}).items || [], today = new Date(Date.now() + 2 * 3600e3).toISOString().slice(0, 10);
    const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const dl = (iso) => M.day(iso).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    const cal = CAL.filter((x) => x.t === t && x.date >= today).map((x) => ({ date: x.date, when: dl(x.date),
      event: x.kind === 'results' ? `Results${x.period ? `, quarter to ${MON[+x.period.slice(5, 7) - 1]} ${x.period.slice(0, 4)}` : ''}` : x.kind === 'split' ? `Stock split, ${x.ratio}` : 'Goes ex-dividend',
      why: x.kind === 'results' ? (x.expected ? 'Expected date (TradingView); the company has not confirmed it.' : 'Confirmed by the company.') + (x.time ? ` ${x.time[0].toUpperCase() + x.time.slice(1)}.` : '')
        : x.kind === 'split' ? `The share price divides by ${M.num(x.factor, x.factor % 1 ? 2 : 0)}; nothing else changes.`
        : `${x.cur === '$' ? '$' : 'EGP '}${M.num(x.amount, 2)} a share${x.pay ? `, paid ${dl(x.pay)}` : ''}${x.declared ? `; declared ${dl(x.declared)}` : ''}.`,
      impact: x.kind === 'results' ? 'high' : 'low' }));
    const hasResults = cal.some((x) => /^Results/.test(x.event));
    const own = (p.next || []).filter((n) => !(n.date && n.date < today) && !(hasResults && !n.date && /results/i.test(n.event)));
    const all = [...cal, ...own].sort((a, b) => (a.date || '9999') < (b.date || '9999') ? -1 : 1);
    M.$('next').innerHTML = all.map((n) => `<div class="wk" style="grid-template-columns:minmax(0,1fr) auto"><b>${M.esc(n.event)}</b><span class="imp${n.impact === 'high' ? ' high' : ''}">${M.esc(n.impact[0].toUpperCase() + n.impact.slice(1))}</span><span class="why" style="grid-column:1/-1"><span class="num">${M.esc(n.when)}</span> · ${M.esc(n.why)}</span></div>`).join('') || '<p class="sub">No dates found yet.</p>';
  }
  const PILL = { 'open': 'open', 'on track': 'ok', 'right': 'ok', 'wrong': 'bad', 'closed': 'open' };
  // the desk's projections for this stock from today's bullish and bearish lists come first
  // the desk's views and projections on this stock, from the record on the Views page (desk/views.json)
  const VL = await M.get('/desk/views.json'), mine = ((VL && VL.views) || []).filter((v) => (v.tickers || []).includes(t));
  M.$('views').innerHTML = mine.map((v) => `<div class="view"><b>${M.esc(v.title)}</b><span><span class="pill ${PILL[v.status] || 'open'}">${M.esc(v.status[0].toUpperCase() + v.status.slice(1))}</span> ${M.conf(M.confNow(v))}</span><span class="why">${M.esc(v.detail)} Wrong if: ${M.esc(v.wrong)}${(v.updates || []).length ? ` · ${v.updates.length} news item${v.updates.length > 1 ? 's' : ''}` : ''}</span></div>`).join('')
    + (mine.length ? '<p class="sub" style="margin-top:10px"><a href="/desk/views/">All views and the news on each →</a></p>' : '')
    || '<p class="sub">No open view on this stock.</p>';
  // news: today's market news that names this stock, then its own news from desk/stocks.json, newest first
  const tagged = [];
  for (const k of ['egx', 'egp', 'us', 'global']) for (const n of ((D.pages[k] || {}).news || [])) if ((n.tickers || []).includes(t) || (n.affects || []).some((x) => x.t === t)) tagged.push({ date: M.ASOF, text: n.headline + '. ' + n.text, source: n.source, url: n.url });
  const seen = new Set(), items = [...(p.news || []), ...tagged].filter((n) => { const k = n.url || n.text.slice(0, 60); if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((x, y) => (y.date > x.date ? 1 : y.date < x.date ? -1 : 0));
  const link = (n) => n.url ? `<a class="src" href="${M.esc(n.url)}" target="_blank" rel="noopener">${M.esc(n.source || 'Source')} →</a>` : n.edition ? `<a class="src" href="/#${n.edition}">Newsletter, ${M.short(n.edition)} →</a>` : '';
  M.$('news').innerHTML = items.map((n) => `<div class="news"><span class="when">${M.day(n.date).toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short' }).replace('Sept', 'Sep')}</span><p>${M.esc(n.text)}</p>${link(n)}</div>`).join('') || '<p class="sub">No company news found in the last month.</p>';
})();
</script>
</body>
</html>
