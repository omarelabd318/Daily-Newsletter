<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2352d6b5'/%3E%3Cpath d='M6 22l7-7 5 4 9-11' fill='none' stroke='%230e1216' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>EGX stocks · Markets Desk</title>
<meta name="description" content="All Egyptian stocks on the desk with their price, trend and latest news.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<script>try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<link rel="stylesheet" href="/desk/desk.css">
</head>
<body>
<main class="canvas">
  <div class="titlerow"><div>
    <div class="crumbs"><a href="/desk/egypt/">Desk</a> / EGX stocks</div>
    <h1 id="title">EGX stocks</h1>
    <p class="finding" id="finding"></p>
  </div></div>
  <div class="vfilters" style="margin-bottom:var(--gap)">
    <div class="seg" id="seg"></div>
    <div class="ctabs" id="view" aria-label="Layout"></div>
    <div class="ctabs" id="sort" aria-label="Order"></div>
    <div class="ctabs" id="cur" aria-label="Currency" hidden></div>
    <div class="ctabs" id="layout" aria-label="Show as"></div>
  </div>
  <div class="sgrid" id="grid"></div>
</main>
<script src="/desk/charts.js"></script>
<script src="/desk/desk.js"></script>
<script>
(async () => {
  const MKT = 'egx', egx = MKT === 'egx';
  const M = Desk, D = await M.init(egx ? '/desk/stocks/egypt/' : '/desk/stocks/us/'); if (!D) return;
  M.$('title').textContent = 'EGX stocks · ' + M.dateLine(D.date);
  const ST = await M.get('/desk/stocks.json'), VL = await M.get('/desk/views.json');
  const views = (VL && VL.views) || [], prof = (ST && ST.stocks) || {};
  // today's market news tagged with a stock counts as its latest news too
  const tagged = {};
  for (const k of ['egx', 'egp', 'us', 'global']) for (const n of ((D.pages[k] || {}).news || [])) for (const t of new Set([...(n.tickers || []), ...(n.affects || []).map((x) => x.t).filter(Boolean)])) (tagged[t] = tagged[t] || []).push({ date: M.ASOF, text: n.headline, source: n.source, url: n.url });
  // a story in both lists keeps its own date from the stock's news
  const latest = (t) => { const own = (prof[t] || {}).news || [], urls = new Set(own.map((n) => n.url));
    return [...own, ...(tagged[t] || []).filter((n) => !urls.has(n.url))].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0))[0]; };
  const tickers = M.GROUP[MKT];
  M.$('finding').textContent = `All ${tickers.length} ${egx ? 'Egyptian' : 'US'} stocks on the desk. Tap one for its page: price chart, performance, valuation, trading, news and the desk's views.`;
  // a wider trend line for the cards
  function line(vals) {
    if (vals.length < 2) return '';
    const w = 220, h = 44, lo = Math.min(...vals), hi = Math.max(...vals), sp = hi - lo || 1, st = (w - 4) / (vals.length - 1);
    const xy = vals.map((v, i) => [2 + i * st, h - 3 - (v - lo) / sp * (h - 6)]);
    return `<svg class="cline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${xy.map((c, i) => (i ? 'L' : 'M') + c[0].toFixed(1) + ' ' + c[1].toFixed(1)).join('')}"/><circle cx="${xy.at(-1)[0].toFixed(1)}" cy="${xy.at(-1)[1].toFixed(1)}" r="2.6"/></svg>`;
  }
  // market value, e.g. 'EGP 370bn' or '$5.1tn'
  const capText = (t) => { const c = (prof[t] || {}).cap; if (!c) return ''; const v = c.value, cur = c.currency === 'USD' ? '$' : 'EGP ';
    return ' · ' + (v >= 1000 ? `${cur}${(v / 1000).toFixed(1)}tn` : `${cur}${v >= 100 ? Math.round(v) : v.toFixed(1)}bn`); };
  let per = M.PERIODS[2], inUSD = false, order = 0, bySector = false, tsort = null;
  // cards or a table, remembered in this browser
  let asTable = false; try { asTable = localStorage.getItem('deskpref:stocks-layout') === 'table'; } catch (e) {}
  const draw = async () => {
    if (per[1] > 400 && !M.full.done) { await M.full(); M.full.done = true; }
    const rows = tickers.map((t) => {
      const raw = M.stock(t), s = inUSD ? M.usd(raw) : raw, c = M.change(s, per[1]), y = M.ytd(s);
      const intra = !per[1] && M.INTRA && M.INTRA[MKT] && M.INTRA[MKT].series[t];
      const wk = per[1] === 7 ? M.weekOf(t, inUSD) : per[1] === 30 ? M.monthOf(t, inUSD) : null;   // 1W and 1M: the sessions through the day, once saved
      const pts = intra ? intra.map((x) => x[1]) : wk ? wk : (per[1] <= 7 ? s.slice(-7) : s.filter(([d]) => d >= M.cut(M.lastDate(s), Math.max(per[1], 7)))).map((x) => x[1]);
      const [lo, hi] = M.range52(raw), now = M.last(raw);
      const open = views.filter((v) => (v.tickers || []).includes(t) && ['open', 'on track'].includes(v.status)).length;
      return { t, s, c, y, pts, lo, hi, now, open, news: latest(t) };
    });
    // order: as listed, by market value (largest first), or by the period's change
    if (order === 1) rows.sort((a, b) => ((prof[b.t] || {}).cap || {}).value - ((prof[a.t] || {}).cap || {}).value || 0);
    if (order > 1) rows.sort((a, b) => (order === 2 ? (b.c ?? -1e9) - (a.c ?? -1e9) : (a.c ?? 1e9) - (b.c ?? 1e9)));
    const cur = inUSD || !egx ? '$' : 'EGP ';
    // a listed stock with no session yet shows when it starts trading instead of figures
    const soon = (t) => { const n = ((prof[t] || {}).next || [])[0]; return n ? `${n.event}: ${n.when}` : 'No prices logged yet'; };
    const card = (r) => r.now == null ? `<a class="card scard" href="/desk/stock/?t=${encodeURIComponent(r.t)}">
      <div class="sh"><span><b>${M.esc(M.NAMES[r.t])}</b><span class="t">${M.esc(r.t)}${(prof[r.t] || {}).sector ? ' · ' + M.esc(prof[r.t].sector) : ''}</span></span><span class="pill open">Not trading yet</span></div>
      <div class="sp"><span class="meta">${M.esc(soon(r.t))}</span></div>
      <p class="snews">${r.news ? `<span class="when">${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][M.day(r.news.date).getMonth()]} ${M.day(r.news.date).getDate()}</span> ${M.esc(r.news.text.length > 120 ? r.news.text.slice(0, 117) + '…' : r.news.text)}` : ''}</p>
    </a>` : `<a class="card scard" href="/desk/stock/?t=${encodeURIComponent(r.t)}">
      <div class="sh"><span><b>${M.esc(M.NAMES[r.t])}</b><span class="t">${M.esc(r.t)}${(prof[r.t] || {}).sector ? ' · ' + M.esc(prof[r.t].sector) : ''}${capText(r.t)}</span></span>${r.open ? `<span class="pill open">${r.open} open view${r.open > 1 ? 's' : ''}</span>` : ''}</div>
      <div class="sp"><span class="lvl num">${cur}${M.num(M.last(r.s))}</span>${M.heroChg(r.s, per)}</div>
      ${line(r.pts)}
      <div class="sk"><span>This year <span class="num ${M.cls(r.y)}">${M.pct(r.y)}</span></span><span class="num">52w ${M.num(r.lo, r.lo < 10 ? 2 : 0)}–${M.num(r.hi, r.hi < 10 ? 2 : 0)}</span></div>
      <div class="range" style="margin:8px 0 0"><i style="left:calc(${((r.now - r.lo) / (r.hi - r.lo || 1) * 100).toFixed(1)}% - 1px)"></i></div>
      <p class="snews">${r.news ? `<span class="when">${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][M.day(r.news.date).getMonth()]} ${M.day(r.news.date).getDate()}</span> ${M.esc(r.news.text.length > 120 ? r.news.text.slice(0, 117) + '…' : r.news.text)}` : '<span class="when">No recent news</span>'}</p>
    </a>`;
    // by sector: the desk's broad sectors, each headed by its equal-weighted change over the period; ordered by
    // combined market value, or by that change when sorting best or worst. Inside a sector the chosen order holds.
    // the table: one line a stock; a column heading sorts by it (again: the other way), over the order chosen above
    if (asTable) {
      const key = { day: (r) => M.change(r.s, 0), per: (r) => r.c, ytd: (r) => r.y, close: (r) => M.last(r.s), name: (r) => M.NAMES[r.t] };
      if (tsort) rows.sort((a, b) => { const x = key[tsort.k](a), y = key[tsort.k](b); if (x == null) return 1; if (y == null) return -1; return (typeof x === 'string' ? x.localeCompare(y) : x - y) * tsort.dir; });
      const th = (k, label, num = true) => `<th class="${num ? 'num ' : ''}${k === 'per' ? 'st-m ' : ''}tsort-h${tsort && tsort.k === k ? ' on' : ''}" data-k="${k}">${label}${tsort && tsort.k === k ? (tsort.dir < 0 ? ' ▾' : ' ▴') : ''}</th>`;
      const trow = (r) => { const d = M.change(r.s, 0), pos = r.now == null ? null : ((r.now - r.lo) / (r.hi - r.lo || 1) * 100);
        return `<tr class="click" onclick="location='/desk/stock/?t=${encodeURIComponent(r.t)}'"><td class="name"><a href="/desk/stock/?t=${encodeURIComponent(r.t)}"><b>${M.esc(M.NAMES[r.t])}</b><span>${M.esc(r.t)}</span></a>${r.open ? `<span class="pill open" style="margin-left:8px">${r.open} view${r.open > 1 ? 's' : ''}</span>` : ''}</td>
          <td class="st-m meta">${M.esc((prof[r.t] || {}).sector || '')}</td>
          <td class="trend st-m">${r.pts.length > 1 ? M.spark([], 7, null, r.pts) : ''}</td>
          <td class="num">${r.now == null ? '<span class="dash">—</span>' : M.num(M.last(r.s))}</td>
          <td class="num"><span class="${M.cls(d)}">${M.pct(d)}</span></td>
          <td class="num st-m"><span class="${M.cls(r.c)}">${M.pct(r.c)}</span></td>
          <td class="num"><span class="${M.cls(r.y)}">${M.pct(r.y)}</span></td>
          <td class="st-m st-range">${pos == null ? '' : `<div class="range"><i style="left:calc(${pos.toFixed(1)}% - 1px)"></i></div><span class="meta num st-rl"><span>${M.num(r.lo, r.lo < 10 ? 2 : 0)}</span><span>${M.num(r.hi, r.hi < 10 ? 2 : 0)}</span></span>`}</td></tr>`; };
      const head = `<thead><tr>${th('name', 'Company', false)}<th class="st-m">Sector</th><th class="trend st-m">${M.esc(per[2])}</th>${th('close', 'Close' + (cur === '$' ? ', $' : ', EGP'))}${th('day', 'Day')}${per[1] ? th('per', per[0]) : ''}${th('ytd', 'This year')}<th class="st-m">52-week range</th></tr></thead>`;
      const fixRow = (h) => per[1] ? h : h.replace(/<td class="num st-m"><span[^>]*>[^<]*<\/span><\/td>/, '');
      let body;
      if (!bySector) body = rows.map((r) => fixRow(trow(r))).join('');
      else body = M.SECTORS[MKT].map(([name, ts]) => { const rs = rows.filter((r) => ts.includes(r.t)); return rs.length ? `<tr class="grp"><th colspan="8">${M.esc(name)}</th></tr>` + rs.map((r) => fixRow(trow(r))).join('') : ''; }).join('');
      M.$('grid').className = 'stable';
      M.$('grid').innerHTML = `<table>${head}<tbody>${body}</tbody></table>`;
      M.$('grid').querySelectorAll('th.tsort-h').forEach((h) => h.addEventListener('click', () => { const k = h.dataset.k; tsort = tsort && tsort.k === k ? { k, dir: -tsort.dir } : { k, dir: k === 'name' ? 1 : -1 }; pressSort(-1); draw(); }));
      return;
    }
    if (!bySector) { M.$('grid').className = 'sgrid'; M.$('grid').innerHTML = rows.map(card).join(''); return; }
    const cap = (t) => ((prof[t] || {}).cap || {}).value || 0;
    const groups = M.SECTORS[MKT].map(([name, ts]) => {
      const rs = rows.filter((r) => ts.includes(r.t)), cs = rs.map((r) => r.c).filter((c) => c != null);
      return { name, rs, avg: cs.length ? cs.reduce((a, b) => a + b, 0) / cs.length : null, cap: ts.reduce((a, t) => a + cap(t), 0) };
    }).filter((g) => g.rs.length);
    const left = rows.filter((r) => !M.SECTORS[MKT].some(([, ts]) => ts.includes(r.t)));
    if (left.length) groups.push({ name: 'Other', rs: left, avg: null, cap: 0 });
    if (order === 2) groups.sort((a, b) => (b.avg ?? -1e9) - (a.avg ?? -1e9)); else if (order === 3) groups.sort((a, b) => (a.avg ?? 1e9) - (b.avg ?? 1e9)); else groups.sort((a, b) => b.cap - a.cap);
    M.$('grid').className = 'sgroups';
    M.$('grid').innerHTML = groups.map((g) => `<section class="sgroup"><h2 class="sgroup-h">${M.esc(g.name)}<span class="meta">${g.rs.length} stock${g.rs.length > 1 ? "s" : ""}${g.avg != null ? ` · ${g.rs.length > 1 ? "average " : ""}<span class="num ${M.cls(g.avg)}">${M.pct(g.avg)}</span> (${per[0]})` : ''}</span></h2><div class="sgrid">${g.rs.map(card).join('')}</div></section>`).join('');
  };
  M.segment(M.$('seg'), '1M', (p) => { per = p; draw(); }, M.PERIODS.concat(M.LONG));
  M.toggle(M.$('view'), ['All', 'By sector'], (i) => { bySector = i === 1; draw(); });
  M.toggle(M.$('sort'), ['List order', 'Largest', 'Best', 'Worst'], (i) => { order = i; tsort = null; draw(); });
  // the table sorts by clicking its headings, so there the row keeps only List order and Largest (no column for
  // either); Best and Worst carry over between the two layouts as a sort on the change column
  const pressSort = (i) => M.$('sort').querySelectorAll('button').forEach((x, j) => x.setAttribute('aria-pressed', j === i));
  const sortRow = () => { const b = M.$('sort').querySelectorAll('button'); b[2].hidden = b[3].hidden = asTable; };
  M.toggle(M.$('layout'), ['Cards', 'Table'], (i) => {
    asTable = i === 1; try { localStorage.setItem('deskpref:stocks-layout', asTable ? 'table' : 'cards'); } catch (e) {}
    if (asTable && order >= 2) { tsort = { k: per[1] ? 'per' : 'day', dir: order === 2 ? -1 : 1 }; order = 0; pressSort(-1); }
    else if (!asTable && tsort) { order = tsort.k === 'per' || tsort.k === 'day' ? (tsort.dir < 0 ? 2 : 3) : 0; tsort = null; pressSort(order); }
    sortRow(); draw();
  });
  if (asTable) { const b = M.$('layout').querySelectorAll('button'); b.forEach((x, i) => x.setAttribute('aria-pressed', i === 1)); }
  sortRow();
  if (egx) { M.$('cur').hidden = false; M.toggle(M.$('cur'), ['EGP', 'USD'], (i) => { inUSD = i === 1; draw(); }); }
  draw();
})();
</script>
</body>
</html>
