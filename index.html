<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Newsletter</title>
<meta name="description" content="A daily briefing on Egypt, World News, Markets, Sports and Culture.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2352d6b5'/%3E%3Cpath d='M18 14h14c11 0 18 7 18 18s-7 18-18 18H18z' fill='%230e1216'/%3E%3C/svg%3E">
<script>document.documentElement.className='js';try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<style>
:root{
  --ground:#0e1216; --raised:#151b21; --ink:#eef2f4; --ink2:#a9b4be; --accent:#52d6b5; --accent-ink:#07201a;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --pad:clamp(16px,4vw,48px);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font:18px/1.7 var(--sans)}
a{color:var(--accent);text-decoration:none;text-underline-offset:3px;transition:color .2s var(--ease)}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:var(--accent);color:var(--accent-ink)}
.frame{max-width:1280px;margin-inline:auto;padding-inline:var(--pad)}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:clamp(32px,4vw,48px);font-size:16px}
.top .grp{display:flex;gap:6px}
.top a,.top .off,#archiveBtn{white-space:nowrap}
.top a,.top .off{font:inherit;color:var(--ink);padding:12px 12px;text-decoration:none;transition:color .2s var(--ease)}
.top a:hover{color:var(--accent);text-decoration:none}
#archiveBtn{font:600 16px var(--sans);color:var(--accent-ink);background:var(--accent);border:0;cursor:pointer;min-height:48px;padding:0 26px;transition:background .2s var(--ease),transform .2s var(--ease)}
#archiveBtn:hover,#archiveBtn[aria-expanded="true"]{background:#7be6ca}
#archiveBtn:active{transform:translateY(1px)}
.top .off{color:var(--ink2);opacity:.45;cursor:default}
#archive{display:none;background:var(--raised);padding:8px var(--pad);margin:16px calc(var(--pad) * -1) 0;max-height:60vh;overflow:auto}
#archive.open{display:block}
#archive a{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;padding:16px 0;color:var(--ink)}
#archive a small{font-size:16px;color:var(--ink2)}
#archive a.current{color:var(--accent)}
#archive a:hover{color:var(--accent);text-decoration:none}

/* masthead */
.mast{padding:clamp(40px,7vw,96px) 0 clamp(40px,6vw,72px)}
.mast h1{margin:0;font:700 clamp(44px,9vw,132px)/.95 var(--serif);letter-spacing:-.04em}
.what{margin:clamp(20px,3vw,32px) 0 0;max-width:34ch;font-size:22px;line-height:1.45;color:var(--ink2)}
.edition{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,5vw,72px);margin-top:clamp(40px,6vw,80px);align-items:start}
.edition .date{font:700 clamp(28px,3vw,40px)/1.1 var(--serif);letter-spacing:-.02em}
.edition .sum{margin:0;font-size:22px;line-height:1.5;max-width:46ch}
.lead{max-width:46ch;margin:16px 0 0;font-size:18px;color:var(--ink2)}
.toc{display:flex;flex-wrap:wrap;gap:4px 22px;margin-top:clamp(28px,4vw,48px);font-size:16px}
.toc a{color:var(--ink);padding:6px 0}
.toc a:hover{color:var(--accent);text-decoration:none}

/* sections */
.s{background:var(--ground);--panel:var(--raised);padding-block:clamp(56px,8vw,104px)}
.s:nth-of-type(even){background:var(--raised);--panel:var(--ground)}
.s-in{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,5vw,72px);align-items:start}
.s h2{margin:0;font:700 clamp(28px,3vw,40px)/1.1 var(--serif);letter-spacing:-.02em;position:sticky;top:24px;overflow-wrap:break-word}
.s-body{min-width:0}
.s-body>*:first-child{margin-top:0}
.s-body p,.s-body ul,.s-body ol{max-width:68ch}
.s-body p{margin:0 0 18px}
.s-body ul,.s-body ol{margin:0 0 22px;padding-left:24px}
.s-body li{margin:8px 0}
.s-body li::marker{color:var(--accent)}
.s-body h3{margin:44px 0 10px;font:700 24px/1.3 var(--sans);letter-spacing:-.01em}
.s-body h3:first-child{margin-top:0}
.s-body h4{margin:28px 0 6px;font-size:18px;color:var(--ink2)}
.s-body strong{font-weight:700}
.s-body [id]{scroll-margin-top:24px}
#today-at-a-glance .s-body a{color:var(--ink)}
#today-at-a-glance .s-body a:hover{color:var(--accent)}
.s-body .sp{height:32px}
.s-body code{background:var(--panel);padding:2px 6px;font-size:.9em}
.s-body blockquote{margin:28px 0;padding:26px 30px;background:var(--panel);font:400 24px/1.5 var(--serif);max-width:68ch}
.tablewrap{overflow-x:auto;margin:6px 0 24px}
table{border-collapse:separate;border-spacing:0 6px;width:100%}
th{padding:6px 16px;text-align:left;font-size:16px;font-weight:600;color:var(--ink2);white-space:nowrap}
td{padding:14px 16px;background:var(--panel);font-size:18px}

td:first-child{font-weight:600}
.s.src .s-body{font-size:16px;color:var(--ink2)}
.s.src .s-body li{margin:6px 0}

/* states and footer */
.state{padding:clamp(64px,12vw,140px) 0;max-width:34ch}
.state b{display:block;margin-bottom:10px;font:700 clamp(28px,4vw,44px)/1.1 var(--serif);letter-spacing:-.02em;color:var(--ink)}
.state span{color:var(--ink2);font-size:22px}
footer{background:var(--raised);padding:clamp(56px,8vw,104px) 0 clamp(40px,5vw,64px)}
.s:last-of-type+footer{background:var(--ground)}
footer .mark{font:700 clamp(44px,9vw,132px)/.95 var(--serif);letter-spacing:-.04em;overflow-wrap:break-word}
footer p{margin:clamp(16px,2vw,24px) 0 0;max-width:40ch;color:var(--ink2);font-size:18px;line-height:1.5}

/* motion: content is visible unless the script has marked it to reveal */
.js .rv{opacity:0;transform:translateY(22px)}
.js .rv.in{opacity:1;transform:none;transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:var(--d,0ms)}
@media print{.js .rv,.js .rv.in{opacity:1;transform:none;transition:none}}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .js .rv,.js .rv.in{opacity:1;transform:none;transition:none}
}

@media (max-width:860px){
  .tablewrap{overflow-x:visible}
  table,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  table{border-spacing:0}
  tr{background:var(--panel);margin:0 0 8px;padding:12px 16px}
  td{background:none;padding:2px 0;font-size:17px}
  td:first-child{font-size:18px;padding-bottom:4px}
  td:nth-child(3){color:var(--ink2);font-size:16px}
  .s-in,.edition,#archive a{grid-template-columns:minmax(0,1fr)}
  .s h2{position:static;margin-bottom:24px}
  .edition{gap:20px}
  #archive a{gap:2px}
  .top{gap:8px}
  #archiveBtn{padding:0 16px;font-size:15px}
  .top a,.top .off{padding:12px 6px}
  .s-body p,.s-body ul,.s-body ol{max-width:none}
}
@media (max-width:340px){.top{flex-wrap:wrap}}

/* ---- broadsheet look (light by default; data-theme="dark" switches to the dark palette) ---- */
:root{
  --ground:#faf8f3; --raised:#f0ebe0; --ink:#16181a; --ink2:#5b6168; --accent:#8a1c1c; --accent-ink:#fff; --rule:#d8d2c4;
  --serif:"Newsreader",Georgia,"Times New Roman",serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
:root[data-theme="dark"]{
  --ground:#0e1216; --raised:#151b21; --ink:#eef2f4; --ink2:#a9b4be; --accent:#52d6b5; --accent-ink:#07201a; --rule:#222a31;
}
body{font:20px/1.65 var(--serif)}
.frame{max-width:780px}
.s-in,.edition{grid-template-columns:minmax(0,1fr)}
.s-in{gap:0}
.s h2{position:static}
.s-body p,.s-body ul,.s-body ol,.s-body blockquote,.edition .sum,.lead{max-width:none}
.mast{position:relative;text-align:center;padding:44px 0 28px;border-bottom:3px double var(--ink)}
.mast h1{font:700 clamp(36px,6.2vw,76px)/1 var(--serif);letter-spacing:-.02em;white-space:nowrap}
.what{margin:14px auto 0;max-width:none;font:600 12px/1.5 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.top{justify-content:space-between;margin-top:26px;padding:6px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.top a,.top .off{font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase}
#archiveBtn{background:none;color:var(--ink);font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;min-height:36px;padding:0}
#archiveBtn:hover,#archiveBtn[aria-expanded="true"]{background:none;color:var(--accent)}
#themeBtn{position:absolute;top:14px;right:0;background:none;border:0;cursor:pointer;color:var(--ink2);font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:8px 0}
#themeBtn:hover{color:var(--accent)}
.edition{text-align:center;gap:10px;margin-top:34px}
.edition .date{font:600 13px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.edition .sum{margin:0 auto;font:400 26px/1.35 var(--serif)}
.lead{font-style:italic;margin:12px auto 0}
.toc{justify-content:center;gap:2px 18px;font:500 13px var(--sans);margin-top:28px}
.s,.s:nth-of-type(even){--panel:var(--raised);background:var(--ground);padding-block:36px}
.s+.s{border-top:1px solid var(--rule)}
.s h2{font:700 12px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 22px;padding-bottom:12px;border-bottom:1px solid var(--ink)}
.s-body h3{font:700 23px/1.3 var(--serif);margin-top:30px}
td{font-family:var(--sans);font-size:17px} th{font-family:var(--sans)}
@media (max-width:860px){
  .top{gap:8px}
  #archiveBtn{padding:0;font-size:12px}
  .top a,.top .off{padding:12px 4px}
  .edition .sum{font-size:22px}
}

</style>
</head>
<body>
<div class="frame">
  <header class="mast">
    <button id="themeBtn" type="button" aria-label="Switch to dark mode">Dark</button>
    <h1>Daily Newsletter</h1>
    <p class="what">A daily briefing on Egypt, World News, Markets, Sports and Culture.</p>
    <div class="top" id="top" hidden>
      <button id="archiveBtn" type="button" aria-expanded="false" aria-controls="archive">Browse the archive</button>
      <div class="grp"><span id="prev"></span><span id="next"></span></div>
    </div>
    <div id="archive" role="list"></div>
    <div class="edition" id="edition" hidden>
      <div class="date" id="dateline"></div>
      <div><p class="sum" id="summary"></p><div id="leadwrap"></div></div>
    </div>
    <nav class="toc" id="toc" aria-label="Sections in this edition" hidden></nav>
  </header>
</div>
<main id="content"><div class="frame"><div class="state"><b>Loading</b></div></div></main>
<footer>
  <div class="frame">
    <div class="mark">Daily Newsletter</div>
    <p>A new edition every day, with the full archive kept here.</p>
  </div>
</footer>
<noscript><div class="frame"><p style="padding:24px 0">This newsletter needs JavaScript to load its editions.</p></div></noscript>
<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var editions = [];
  // Entrance motion: each block fades up once it is on or above the bottom of the screen.
  // A scroll sweep (not an observer) so blocks skipped by a fast scroll or a jump are still shown.
  var pending = [], ticking = false;
  function sweep(){
    ticking = false;
    var vh = window.innerHeight, n = 0;
    pending = pending.filter(function(el){
      if(el.getBoundingClientRect().top < vh*0.96){
        el.style.setProperty('--d', Math.min(n,5)*70+'ms'); n++;
        el.classList.add('in'); return false;
      }
      return true;
    });
  }
  function queueSweep(){ if(!ticking){ ticking = true; requestAnimationFrame(sweep); } }
  window.addEventListener('scroll',queueSweep,{passive:true});
  window.addEventListener('resize',queueSweep);

  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}

  // ---- tiny, safe markdown renderer ----
  function inline(s){
    s = esc(s);
    s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    s = s.replace(/\[([^\]]+)\]\((#[a-z0-9-]+)\)/g,'<a href="$2">$1</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>');
    return s;
  }
  function cells(line){
    return line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(c){return c.trim()});
  }
  // returns {lead: html, sections: [{title, id, html}]}
  function render(md){
    var lines = md.replace(/\r/g,'').split('\n'), i = 0;
    var lead = [], sections = [], cur = null;
    function push(h){ (cur ? cur.parts : lead).push(h); }
    while(i < lines.length){
      var l = lines[i];
      if(!l.trim()){i++;continue}
      var m;
      if((m = l.match(/^(#{1,4})\s+(.*)$/))){
        var lv = Math.max(2, m[1].length);
        if(lv === 2){
          var t = m[2].replace(/[*_`]/g,'');
          cur = {title:t, id:slug(t)||('s'+sections.length), parts:[]};
          sections.push(cur);
        } else { push('<h'+lv+' id="'+slug(m[2].replace(/[*_`]/g,''))+'">'+inline(m[2])+'</h'+lv+'>'); }
        i++;continue;
      }
      if(/^\s*(---+|\*\*\*+)\s*$/.test(l)){push('<div class="sp"></div>');i++;continue}
      if(/^\s*\|/.test(l) && i+1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i+1])){
        var head = cells(l), body = [];
        i += 2;
        while(i < lines.length && /^\s*\|/.test(lines[i])){body.push(cells(lines[i]));i++}
        var t2 = '<div class="tablewrap"><table><thead><tr>'+head.map(function(c){return '<th>'+inline(c)+'</th>'}).join('')+'</tr></thead><tbody>';
        body.forEach(function(r){t2 += '<tr>'+r.map(function(c){return '<td>'+inline(c)+'</td>'}).join('')+'</tr>'});
        push(t2+'</tbody></table></div>');continue;
      }
      if(/^\s*>/.test(l)){
        var q = [];
        while(i < lines.length && /^\s*>/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,''));i++}
        push('<blockquote>'+inline(q.join(' '))+'</blockquote>');continue;
      }
      if(/^\s*[-*]\s+/.test(l)){
        var ul = [];
        while(i < lines.length && /^\s*[-*]\s+/.test(lines[i])){ul.push('<li>'+inline(lines[i].replace(/^\s*[-*]\s+/,''))+'</li>');i++}
        push('<ul>'+ul.join('')+'</ul>');continue;
      }
      if(/^\s*\d+[.)]\s+/.test(l)){
        var ol = [];
        while(i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){ol.push('<li>'+inline(lines[i].replace(/^\s*\d+[.)]\s+/,''))+'</li>');i++}
        push('<ol>'+ol.join('')+'</ol>');continue;
      }
      var p = [];
      while(i < lines.length && lines[i].trim() && !/^(#{1,4}\s|\s*[-*]\s+|\s*\d+[.)]\s+|\s*>|\s*\||\s*---)/.test(lines[i])){p.push(lines[i].trim());i++}
      if(!p.length){p.push(l.trim());i++}
      push('<p>'+inline(p.join(' '))+'</p>');
    }
    return {lead:lead.join('\n'), sections:sections.map(function(s){
      return {title:s.title,id:s.id,html:s.parts.join('\n')};
    })};
  }

  function pretty(d){
    var dt = new Date(d+'T12:00:00');
    if(isNaN(dt)) return d;
    return dt.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  }
  // an edition's key is its id when it has one (a second edition on the same day), otherwise its date
  function key(e){return e.id || e.date}
  function title(e){return pretty(e.date) + (e.label ? ' · ' + e.label : '')}
  // short form for the browser tab, e.g. "Wed 28 Oct · 2.0"
  function tabTitle(e){
    var dt = new Date(e.date+'T12:00:00');
    var d = isNaN(dt) ? e.date : dt.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}).replace(',','');
    return d + (e.label ? ' · ' + e.label.replace(/^Edition\s+/i,'') : '');
  }
  function state(title,msg){
    $('content').innerHTML='<div class="frame"><div class="state"><b>'+esc(title)+'</b><span>'+esc(msg||'')+'</span></div></div>';
  }
  function buildArchive(current){
    $('archive').innerHTML = editions.map(function(e){
      return '<a role="listitem" href="#'+key(e)+'"'+(key(e)===current?' class="current"':'')+'><span>'+esc(title(e))+'</span><small>'+esc(e.summary||'')+'</small></a>';
    }).join('');
  }
  function setNav(idx){
    var older = editions[idx+1], newer = editions[idx-1];
    $('prev').innerHTML = older ? '<a href="#'+key(older)+'">&larr; Older</a>' : '<span class="off">&larr; Older</span>';
    $('next').innerHTML = newer ? '<a href="#'+key(newer)+'">Newer &rarr;</a>' : '<span class="off">Newer &rarr;</span>';
  }

  function show(){
    var date = (location.hash||'').replace('#','');
    var idx = editions.findIndex(function(e){return key(e)===date});
    if(idx < 0) idx = 0;
    var ed = editions[idx];
    $('archive').classList.remove('open');
    $('archiveBtn').setAttribute('aria-expanded','false');
    $('dateline').textContent = title(ed);
    $('summary').textContent = ed.summary || '';
    $('summary').hidden = !ed.summary;
    $('edition').hidden = false;
    document.title = 'Daily Newsletter · ' + tabTitle(ed);
    buildArchive(key(ed)); setNav(idx);
    fetch('editions/'+key(ed)+'.md',{cache:'no-cache'}).then(function(r){
      if(!r.ok) throw new Error(r.status);
      return r.text();
    }).then(function(md){
      var r = render(md);
      $('leadwrap').innerHTML = r.lead ? '<div class="lead">'+r.lead.replace(/<\/?p>/g,'')+'</div>' : '';
      $('toc').innerHTML = r.sections.filter(function(s){return s.title.toLowerCase()!=='sources'}).map(function(s){return '<a href="#'+s.id+'" data-jump="1">'+esc(s.title)+'</a>'}).join('');
      $('toc').hidden = !r.sections.length;
      $('content').innerHTML = r.sections.map(function(s){
        var src = s.title.toLowerCase()==='sources' ? ' src' : '';
        return '<section class="s'+src+'" id="'+s.id+'"><div class="frame"><div class="s-in"><h2 class="rv">'+esc(s.title)+'</h2><div class="s-body">'+s.html+'</div></div></div></section>';
      }).join('');
      // each story that opens with a bold lead-in gets an anchor, so Today at a Glance can link to it
      var used = {};
      document.querySelectorAll('#content section:not(#today-at-a-glance) .s-body p, #content section:not(#today-at-a-glance) .s-body li').forEach(function(el){
        var f = el.firstElementChild;
        if(!f || f.tagName !== 'STRONG' || el.firstChild !== f) return;
        var id = 'story-' + slug(f.textContent.replace(/:\s*$/,''));
        if(id === 'story-' || used[id]) return;
        used[id] = 1; el.id = id;
      });
      // only each section's heading and opening block animate in; the rest of the text is always visible
      document.querySelectorAll('#content .s-body > *:first-child').forEach(function(el){el.classList.add('rv')});
      document.querySelectorAll('.mast > *').forEach(function(el){el.classList.add('rv')});
      pending = Array.prototype.slice.call(document.querySelectorAll('.rv'));
      window.scrollTo(0,0);
      sweep();
    }).catch(function(){state('Could not load this edition','Please try again in a moment.')});
  }

  // light/dark switch, remembered on this device
  function syncThemeBtn(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    $('themeBtn').textContent = dark ? 'Light' : 'Dark';
    $('themeBtn').setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  }
  $('themeBtn').addEventListener('click',function(){
    var dark = document.documentElement.getAttribute('data-theme') !== 'dark';
    if(dark) document.documentElement.setAttribute('data-theme','dark'); else document.documentElement.removeAttribute('data-theme');
    try{ localStorage.setItem('theme', dark ? 'dark' : 'light'); }catch(e){}
    syncThemeBtn();
  });
  syncThemeBtn();

  $('archiveBtn').addEventListener('click',function(){
    var open = $('archive').classList.toggle('open');
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  window.addEventListener('hashchange',function(){
    var h = (location.hash||'').replace('#','');
    if(!editions.length) return;
    if(/^\d{4}-\d{2}-\d{2}(-[a-z0-9]+)?$/.test(h)) show();   // section links are plain in-page anchors
  });

  fetch('editions/index.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(data){
    editions = (data.editions||[]).slice().sort(function(a,b){return key(a)<key(b)?1:-1});
    if(!editions.length){
      state('The first edition is on its way','New editions are added every day.');
      return;
    }
    $('top').hidden = false;
    // a refresh always opens the newest edition; a shared link to a dated edition still opens that one
    var nav = window.performance && performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
    if(nav && nav.type === 'reload' && location.hash) history.replaceState(null, '', location.pathname + location.search);
    show();
  }).catch(function(){state('Could not load the newsletter','Please try again in a moment.')});
})();
</script>
</body>
</html>
