<style>
:root{
  --ground:#0e1216; --raised:#151b21; --ink:#eef2f4; --ink2:#a9b4be; --accent:#52d6b5; --accent-ink:#07201a;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --pad:clamp(16px,4vw,48px);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font:18px/1.7 var(--sans)}
a{color:var(--accent);text-decoration:none;text-underline-offset:3px;transition:color .2s var(--ease)}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:var(--accent);color:var(--accent-ink)}
.frame{max-width:1280px;margin-inline:auto;padding-inline:var(--pad)}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:clamp(32px,4vw,48px);font-size:16px}
.top .grp{display:flex;gap:6px}
.top a,.top .off,#archiveBtn{white-space:nowrap}
.top a,.top .off{font:inherit;color:var(--ink);padding:12px 12px;text-decoration:none;transition:color .2s var(--ease)}
.top a:hover{color:var(--accent);text-decoration:none}
#archiveBtn{font:600 16px var(--sans);color:var(--accent-ink);background:var(--accent);border:0;cursor:pointer;min-height:48px;padding:0 26px;transition:background .2s var(--ease),transform .2s var(--ease)}
#archiveBtn:hover,#archiveBtn[aria-expanded="true"]{background:#7be6ca}
#archiveBtn:active{transform:translateY(1px)}
.top .off{color:var(--ink2);opacity:.45;cursor:default}
#archive{display:none;background:var(--raised);padding:8px var(--pad);margin:16px calc(var(--pad) * -1) 0;max-height:60vh;overflow:auto}
#archive.open{display:block}
#archive a{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;padding:16px 0;color:var(--ink)}
#archive a small{font-size:16px;color:var(--ink2)}
#archive a.current{color:var(--accent)}
#archive a:hover{color:var(--accent);text-decoration:none}

/* masthead */
.mast{padding:clamp(40px,7vw,96px) 0 clamp(40px,6vw,72px)}
.mast h1{margin:0;font:700 clamp(44px,9vw,132px)/.95 var(--serif);letter-spacing:-.04em}
.what{margin:clamp(20px,3vw,32px) 0 0;max-width:34ch;font-size:22px;line-height:1.45;color:var(--ink2)}
.edition{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,5vw,72px);margin-top:clamp(40px,6vw,80px);align-items:start}
.edition .date{font:700 clamp(28px,3vw,40px)/1.1 var(--serif);letter-spacing:-.02em}
.edition .sum{margin:0;font-size:22px;line-height:1.5;max-width:46ch}
.lead{max-width:46ch;margin:16px 0 0;font-size:18px;color:var(--ink2)}
.toc{display:flex;flex-wrap:wrap;gap:4px 22px;margin-top:clamp(28px,4vw,48px);font-size:16px}
.toc a{color:var(--ink);padding:6px 0}
.toc a:hover{color:var(--accent);text-decoration:none}

/* sections */
.s{background:var(--ground);--panel:var(--raised);padding-block:clamp(56px,8vw,104px)}
.s:nth-of-type(even){background:var(--raised);--panel:var(--ground)}
.s-in{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,5vw,72px);align-items:start}
.s h2{margin:0;font:700 clamp(28px,3vw,40px)/1.1 var(--serif);letter-spacing:-.02em;position:sticky;top:24px;overflow-wrap:break-word}
.s-body{min-width:0}
.s-body>*:first-child{margin-top:0}
.s-body p,.s-body ul,.s-body ol{max-width:68ch}
.s-body p{margin:0 0 18px}
.s-body ul,.s-body ol{margin:0 0 22px;padding-left:24px}
.s-body li{margin:8px 0}
.s-body li::marker{color:var(--accent)}
.s-body h3{margin:44px 0 10px;font:700 24px/1.3 var(--sans);letter-spacing:-.01em}
.s-body h3:first-child{margin-top:0}
.s-body h4{margin:28px 0 6px;font-size:18px;color:var(--ink2)}
.s-body strong{font-weight:700}
.s-body [id]{scroll-margin-top:24px}
#today-at-a-glance .s-body a{color:var(--ink)}
#today-at-a-glance .s-body a:hover{color:var(--accent)}
.s-body .sp{height:32px}
.s-body code{background:var(--panel);padding:2px 6px;font-size:.9em}
.s-body blockquote{margin:28px 0;padding:26px 30px;background:var(--panel);font:400 24px/1.5 var(--serif);max-width:68ch}
.tablewrap{overflow-x:auto;margin:6px 0 24px}
table{border-collapse:separate;border-spacing:0 6px;width:100%}
th{padding:6px 16px;text-align:left;font-size:16px;font-weight:600;color:var(--ink2);white-space:nowrap}
td{padding:14px 16px;background:var(--panel);font-size:18px}

td:first-child{font-weight:600}
.s.src .s-body{font-size:16px;color:var(--ink2)}
.s.src .s-body li{margin:6px 0}

/* states and footer */
.state{padding:clamp(64px,12vw,140px) 0;max-width:34ch}
.state b{display:block;margin-bottom:10px;font:700 clamp(28px,4vw,44px)/1.1 var(--serif);letter-spacing:-.02em;color:var(--ink)}
.state span{color:var(--ink2);font-size:22px}
footer{background:var(--raised);padding:clamp(56px,8vw,104px) 0 clamp(40px,5vw,64px)}
.s:last-of-type+footer{background:var(--ground)}
footer .mark{font:700 clamp(44px,9vw,132px)/.95 var(--serif);letter-spacing:-.04em;overflow-wrap:break-word}
footer .todesk{font:600 13px var(--sans);letter-spacing:.12em;text-transform:uppercase}
footer .todesk a{color:var(--ink);text-decoration:none} footer .todesk a:hover{color:var(--accent)}
footer p{margin:clamp(16px,2vw,24px) 0 0;max-width:60ch;text-wrap:balance;color:var(--ink2);font-size:18px;line-height:1.5}

/* motion: content is visible unless the script has marked it to reveal */
.js .rv{opacity:0;transform:translateY(22px)}
.js .rv.in{opacity:1;transform:none;transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:var(--d,0ms)}
@media print{.js .rv,.js .rv.in{opacity:1;transform:none;transition:none}}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .js .rv,.js .rv.in{opacity:1;transform:none;transition:none}
}

@media (max-width:860px){
  .tablewrap{overflow-x:visible}
  table,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  table{border-spacing:0}
  tr{background:var(--panel);margin:0 0 8px;padding:12px 16px}
  td{background:none;padding:2px 0;font-size:17px}
  td:first-child{font-size:18px;padding-bottom:4px}
  td.c3{color:var(--ink2);font-size:16px}
  tr td.num,tr td.num.na{text-align:left}
  tr td:empty{display:none}
  td[data-label]{padding-left:72px}
  td[data-label]::before{content:attr(data-label);display:inline-block;min-width:62px;margin:0 10px 0 -72px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);vertical-align:1px}
  tr{position:relative}
  /* the trend line sits on the right, centred down the card; every line keeps that strip clear */
  tr.has-trend td:not(.trend){padding-right:84px}
  tr.trend-long td:not(.trend){padding-right:140px}
  tr td.trend{position:absolute;top:50%;transform:translateY(-50%);right:16px;width:auto;padding:0;text-align:center}
  tr td.trend::before{display:block;min-width:0;margin:0 0 3px;font-size:9.5px;letter-spacing:.08em}
  tr td.trend .spark{margin:0 auto}
  tr:not(.has-trend) td.trend{display:none}
  /* watch tables on a phone: one compact row per item, like a stock app: name and YTD on the left, the trend line,
     then the price over its change; a currency's note runs underneath */
  #content table.watch tbody tr{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(78px,auto);grid-template-areas:"name trend val" "sub trend chg" "note note note";column-gap:12px;row-gap:1px;align-items:center;padding:10px 14px;margin:0 0 4px}
  #content table.watch:not(.all) tr.xrow{display:none}
  #content table.watch td{padding:0;font-size:16px;line-height:22px}
  #content table.watch td::before{display:none}
  #content table.watch td:first-child{grid-area:name;font-size:15px;line-height:20px;padding:0}
  #content table.watch td.trend{grid-area:trend;position:static;transform:none;width:64px}
  #content table.watch td.trend::before{display:none}
  #content table.watch td[data-label="Close"],#content table.watch td[data-label="Level"]{grid-area:val;text-align:right;font-weight:600}
  #content table.watch td[data-label^="Change"]{grid-area:chg;text-align:right;font-size:14px}
  #content table.watch td[data-label="YTD"]{grid-area:sub;white-space:nowrap;font-size:13px;color:var(--ink2)}
  #content table.watch td[data-label="YTD"]::before{display:inline;content:"YTD ";min-width:0;margin:0 4px 0 0;font-size:10.5px}
  #content table.watch td[data-label="Note"]{grid-area:note;font-size:13px;line-height:18px;color:var(--ink2);padding-top:4px}
  #content table.watch td[data-label="Note"] .chg{font-size:13px}
  .s-in,.edition,#archive a{grid-template-columns:minmax(0,1fr)}
  .s h2{position:static;margin-bottom:24px}
  .edition{gap:20px}
  #archive a{gap:2px}
  .top{gap:8px}
  #archiveBtn{padding:0 16px;font-size:15px}
  .top a,.top .off{padding:12px 6px}
  .s-body p,.s-body ul,.s-body ol{max-width:none}
}
@media (max-width:340px){.top{flex-wrap:wrap}}

/* ---- broadsheet look (light by default; data-theme="dark" switches to the dark palette) ---- */
:root{
  --ground:#faf8f3; --raised:#f0ebe0; --ink:#16181a; --ink2:#5b6168; --accent:#8a1c1c; --accent-ink:#fff; --rule:#d8d2c4;
  --serif:"Newsreader",Georgia,"Times New Roman",serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
:root{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark;
  --ground:#0e1216; --raised:#151b21; --ink:#eef2f4; --ink2:#a9b4be; --accent:#52d6b5; --accent-ink:#07201a; --rule:#222a31;
}
body{font:20px/1.65 var(--serif)}
.frame{max-width:780px}
.s-in,.edition{grid-template-columns:minmax(0,1fr)}
.s-in{gap:0}
.s h2{position:static}
.s-body p,.s-body ul,.s-body ol,.s-body blockquote,.edition .sum,.lead{max-width:none}
.mast{position:relative;text-align:center;padding:44px 0 28px;border-bottom:3px double var(--ink)}
.mast h1{font:700 clamp(36px,6.2vw,76px)/1 var(--serif);letter-spacing:-.02em;white-space:nowrap}
.what{margin:14px auto 0;max-width:none;font:600 12px/1.5 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.top{justify-content:space-between;margin-top:26px;padding:6px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.top a,.top .off{font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase}
#archiveBtn{background:none;color:var(--ink);font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;min-height:36px;padding:0}
#archiveBtn:hover,#archiveBtn[aria-expanded="true"]{background:none;color:var(--accent)}
#themeBtn{position:absolute;top:14px;right:0;background:none;border:0;cursor:pointer;color:var(--ink2);font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:8px 0}
#themeBtn:hover{color:var(--accent)}
.edition{text-align:center;gap:10px;margin-top:34px}
.edition .date{font:600 13px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}

.s,.s:nth-of-type(even){--panel:var(--raised);background:var(--ground);padding-block:36px}
.s+.s{border-top:1px solid var(--rule)}
.s h2{font:700 12px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 22px;padding-bottom:12px;border-bottom:1px solid var(--ink)}
.s-body h3{font:700 23px/1.3 var(--serif);margin-top:30px}
td{font-family:var(--sans);font-size:17px} th{font-family:var(--sans)}
@media (max-width:860px){
  .top{gap:8px}
  #archiveBtn{padding:0;font-size:12px}
  .top a,.top .off{padding:12px 4px}
  .edition .sum{font-size:22px}
}


/* search, explained boxes, print */
#archive{text-align:left}
:root{--up:#1d7a3a;--down:#b3261e}
:root[data-theme="dark"]{--up:#5fd08a;--down:#ff8a80}
.chg{white-space:nowrap} .chg.up{color:var(--up)} .chg.down{color:var(--down)} .chg.big{font-weight:700}
.chg span{font-size:.8em}
.spark{display:block;overflow:visible;margin:0 auto}
th.trend,td.trend{width:1%;white-space:nowrap;text-align:center}
th.num{text-align:center}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.num.na{text-align:center}
.pbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 12px}
.pbar-l{font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-right:4px}
.pbar button{font:600 13px/1 var(--sans);padding:8px 12px;min-height:34px;border:1px solid var(--rule);background:transparent;color:var(--ink2);cursor:pointer}
.pbar button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
@media print{.pbar{display:none}}
/* the watch tables: notes stay on one or two lines; the less-watched currency and gold rows fold behind a button */
#content table.watch td,#content table.watch th{padding-left:12px;padding-right:12px}
#content table.watch td{padding-top:10px;padding-bottom:10px}
#content table.watch td.num,#content table.watch td[data-label="Level"]{white-space:nowrap}
#content table.watch td.c3[data-label="Note"]{min-width:140px;font-size:15px;line-height:21px}
#content table.watch:not(.all) tr.xrow{display:none}
.morerows{display:block;cursor:pointer;font:600 13px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);background:none;border:0;padding:8px 0;margin:4px 0 0}
.morerows::before{content:"+ ";color:var(--accent)} .morerows[aria-expanded="true"]::before{content:"\2212  "}
.morerows:hover{color:var(--accent)}
@media print{.morerows{display:none}#content table.watch tr.xrow{display:revert}}
td.trend{vertical-align:middle}
.unc{color:var(--accent);font-weight:700;margin-left:2px}

.spark path{fill:none;stroke:var(--ink2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--accent);stroke:var(--panel);stroke-width:1.5}
#q{width:100%;margin:8px 0 4px;padding:10px 12px;font:500 15px var(--sans);color:var(--ink);background:var(--ground);border:1px solid var(--rule);border-radius:0}
#q:focus{outline:2px solid var(--accent);outline-offset:0}
#results a small.where{display:block;margin-top:2px;font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
#results .none{font:500 15px var(--sans);color:var(--ink2);padding:12px 0;margin:0}
.s-body blockquote.explain{margin:10px 0 24px;padding:12px 16px;border-left:3px solid var(--accent);font:400 16px/1.6 var(--sans);color:var(--ink2)}
.s-body .hit{outline:2px solid var(--accent);outline-offset:6px;transition:outline-color 1s}
@media print{
  :root,:root[data-theme="dark"]{--ground:#fff;--raised:#f2f2f2;--panel:#f2f2f2;--ink:#000;--ink2:#444;--accent:#8a1c1c;--rule:#ccc}
  body{background:#fff;color:#000;font-size:11pt}
  #themeBtn,.top,#archive,.toc,footer,noscript{display:none!important}
  .rv{opacity:1!important;transform:none!important}
  .mast{padding:0 0 12pt}
  .s,.s:nth-of-type(even){padding-block:12pt;background:#fff}
  .s h2,.s-body h3{break-after:avoid}
  .s-body p,.s-body li,tr{break-inside:avoid}
  a{color:inherit;text-decoration:none}
  td{background:#f2f2f2!important}
}

/* wide layout (a reader's choice on large screens, remembered on this device): the page uses the screen's width
   and each section's stories run in two columns, like a broadsheet; tables, subheads and boxes span both */
#widthBtn{display:none;position:absolute;top:14px;left:0;background:none;border:0;cursor:pointer;color:var(--ink2);font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:8px 0}
#widthBtn:hover{color:var(--accent)}
@media (min-width:1100px){
  #widthBtn{display:block}
  :root[data-width="wide"] .frame{max-width:1320px}
  /* stories run in two columns inside each .run (the blocks between subheads and tables, grouped by the script);
     nothing spans the columns, which Safari draws badly */
  :root[data-width="wide"] .s-body .run{column-count:2;column-gap:56px;column-rule:1px solid var(--rule)}
  :root[data-width="wide"] .run > p,:root[data-width="wide"] .run > blockquote,:root[data-width="wide"] .run li{break-inside:avoid}
  :root[data-width="wide"] .run > blockquote.explain{margin-top:0}
  :root[data-width="wide"] .run > ol,:root[data-width="wide"] .run > ul{margin-top:0}
  :root[data-width="wide"] .s-body > h3{margin-top:36px}
  :root[data-width="wide"] .s.src .s-body ul{columns:3;column-gap:40px}
  :root[data-width="wide"] .edition .sum{max-width:60ch}
  :root[data-width="wide"] .toc{margin-inline:calc(var(--pad) * -1);gap:2px 12px;font-size:12px}
}
@media print{#widthBtn{display:none!important}}

.listen:hover{background:var(--ink);color:var(--ground)}

.reading{background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 12%,transparent);border-radius:2px;transition:background .3s var(--ease)}
#player{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom));background:var(--ground);border-top:1px solid var(--ink);box-shadow:0 -8px 24px rgba(0,0,0,.08)}
#player[hidden]{display:none}
.pl-in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,1.3fr) minmax(0,1fr);grid-template-areas:"now prog right" "now ctl right";align-items:center;gap:2px 24px}
.pl-l{grid-area:now;min-width:0;font:13px/1.35 var(--sans)}
.pl-l b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:400;color:var(--ink2)}
.pl-l b strong{font-weight:600;color:var(--ink)}
.pl-ctl{grid-area:ctl;display:flex;align-items:center;justify-content:center;gap:18px}

<body>
<div class="frame mast-frame">
  <header class="mast">
    <h1>Daily Newsletter</h1>
    <p class="what">A daily briefing on Egypt, World News, Markets, Sports and Culture.</p>
    <div class="top" id="top" hidden>
      <div class="grp grp-l"><button id="archiveBtn" type="button" aria-expanded="false" aria-controls="archive"><span class="lg">Browse the </span>archive</button><a id="topicsLink" href="#topics">Topics</a><a id="deskLink" href="/desk/" aria-label="Markets Desk"><span class="lg2">Markets </span>Desk</a></div>
      <div class="grp"><span id="prev"></span><span id="next"></span></div>
      <div class="grp grp-r"><button id="widthBtn" type="button" aria-pressed="false">Wide</button><button id="themeBtn" type="button" aria-label="Switch to dark mode">Dark</button></div>
    </div>
    <div id="archive"><input id="q" type="search" placeholder="Search all editions" aria-label="Search all editions" autocomplete="off"><div id="archList" role="list"></div><div id="results" role="list" hidden></div></div>
    <div class="edition" id="edition" hidden>
      <div class="date" id="dateline"></div>
      <div><p class="sum" id="summary"></p><div id="leadwrap"></div><div id="listenwrap"></div></div>
    </div>
    <nav class="toc" id="toc" aria-label="Sections in this edition" hidden></nav>
  </header>
</div>
<main id="content"><div class="frame"><div class="state"><b>Loading</b></div></div></main>
<footer>
  <div class="frame">
    <div class="mark">Daily Newsletter</div>
    <p>A new edition every day, with the full archive kept here.</p>
    <p class="todesk"><a href="/desk/">Markets Desk →</a> <span aria-hidden="true">·</span> <a href="/desk/runs/">Runs</a> <span aria-hidden="true">·</span> <a href="/podcast/heart.xml" title="Add this address in a podcast app">Podcast feed</a></p>
  </div>
</footer>
<noscript><div class="frame"><p style="padding:24px 0">This newsletter needs JavaScript to load its editions.</p></div></noscript>
<script src="listen.js"></script>
<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var editions = [];
  // Entrance motion: each block fades up once it is on or above the bottom of the screen.
  // A scroll sweep (not an observer) so blocks skipped by a fast scroll or a jump are still shown.
  var pending = [], ticking = false;
  function sweep(){
    ticking = false;
    var vh = window.innerHeight, n = 0;
    pending = pending.filter(function(el){
      if(el.getBoundingClientRect().top < vh*0.96){
        el.style.setProperty('--d', Math.min(n,5)*70+'ms'); n++;
        el.classList.add('in');
        // once it has faded in, it goes back to plain text: Safari keeps an animated block on a layer of its own,
        // where the Listen word highlight does not redraw
        setTimeout(function(){ el.classList.remove('rv', 'in'); el.style.removeProperty('--d'); }, Math.min(n, 5) * 70 + 800);
        return false;
      }
      return true;
    });
  }
  function queueSweep(){ if(!ticking){ ticking = true; requestAnimationFrame(sweep); } }
  window.addEventListener('scroll',queueSweep,{passive:true});
  window.addEventListener('resize',queueSweep);

  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}

  // ---- tiny, safe markdown renderer ----
  function inline(s){
    s = esc(s);
    s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    s = s.replace(/\[([^\]]+)\]\((#[a-z0-9-]+)\)/g,'<a href="$2">$1</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>');
    return s;
  }
  function cells(line){
    return line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(c){return c.trim()});
  }
  // returns {lead: html, sections: [{title, id, html}]}
  function render(md){
    var lines = md.replace(/\r/g,'').split('\n'), i = 0;
    var lead = [], sections = [], cur = null;
    function push(h){ (cur ? cur.parts : lead).push(h); }
    while(i < lines.length){
      var l = lines[i];
      if(!l.trim()){i++;continue}
      var m;
      if((m = l.match(/^(#{1,4})\s+(.*)$/))){
        var lv = Math.max(2, m[1].length);
        if(lv === 2){
          var t = m[2].replace(/[*_`]/g,'');
          cur = {title:t, id:slug(t)||('s'+sections.length), parts:[]};
          sections.push(cur);
        } else { push('<h'+lv+' id="'+slug(m[2].replace(/[*_`]/g,''))+'">'+inline(m[2])+'</h'+lv+'>'); }
        i++;continue;
      }
      if(/^\s*(---+|\*\*\*+)\s*$/.test(l)){push('<div class="sp"></div>');i++;continue}
      if(/^\s*\|/.test(l) && i+1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i+1])){
        var head = cells(l), body = [];
        i += 2;
        while(i < lines.length && /^\s*\|/.test(lines[i])){body.push(cells(lines[i]));i++}
        // number columns: figures right-aligned so decimals line up, headers centred over them
        var num = head.map(function(c){ return /^(Close|Change|YTD)$/i.test(c.replace(/[*_`]/g,'').trim()); });
        var t2 = '<div class="tablewrap"><table><thead><tr>'+head.map(function(c,ci){return '<th'+(num[ci]?' class="num"':'')+'>'+inline(c)+'</th>'}).join('')+'</tr></thead><tbody>';
        body.forEach(function(r){t2 += '<tr>'+r.map(function(c,ci){
          var h = inline(c).replace(/\s*\(unconfirmed\)/gi, function(){ return '<sup class="unc" title="Unconfirmed">*<span class="vh"> unconfirmed</span></sup>'; });
          // the column name, shown as a small label on phones where the header row is hidden
          var lab = ci && head[ci] ? ' data-label="'+esc(head[ci].replace(/[*_`]/g,'').trim())+'"' : '';
          // placeholders are centred: there is no number to line up
          var na = num[ci] && /^(n\/a|—|–|-)$/i.test(c.trim());
          var cls = [ci===2?'c3':'', num[ci]?'num':'', na?'na':''].join(' ').trim();
          return '<td'+(cls?' class="'+cls+'"':'')+lab+'>'+h+'</td>';
        }).join('')+'</tr>'});
        push(t2+'</tbody></table></div>');continue;
      }
      if(/^\s*>/.test(l)){
        var q = [];
        while(i < lines.length && /^\s*>/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,''));i++}
        var qh = inline(q.join(' '));
        push('<blockquote'+(/^<strong>Explained/.test(qh)?' class="explain"':'')+'>'+qh+'</blockquote>');continue;
      }
      if(/^\s*[-*]\s+/.test(l)){
        var ul = [];
        while(i < lines.length && /^\s*[-*]\s+/.test(lines[i])){ul.push('<li>'+inline(lines[i].replace(/^\s*[-*]\s+/,''))+'</li>');i++}
        push('<ul>'+ul.join('')+'</ul>');continue;
      }
      if(/^\s*\d+[.)]\s+/.test(l)){
        var ol = [];
        while(i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){ol.push('<li>'+inline(lines[i].replace(/^\s*\d+[.)]\s+/,''))+'</li>');i++}
        push('<ol>'+ol.join('')+'</ol>');continue;
      }
      var p = [];
      while(i < lines.length && lines[i].trim() && !/^(#{1,4}\s|\s*[-*]\s+|\s*\d+[.)]\s+|\s*>|\s*\||\s*---)/.test(lines[i])){p.push(lines[i].trim());i++}
      if(!p.length){p.push(l.trim());i++}
      push('<p>'+inline(p.join(' '))+'</p>');
    }
    return {lead:lead.join('\n'), sections:sections.map(function(s){
      return {title:s.title,id:s.id,html:s.parts.join('\n')};
    })};
  }

  function pretty(d){
    var dt = new Date(d+'T12:00:00');
    if(isNaN(dt)) return d;
    return dt.toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  }
  // an edition's key is its id when it has one (a second edition on the same day), otherwise its date
  function key(e){return e.id || e.date}
  function title(e){return pretty(e.date) + (e.label ? ' · ' + e.label : '')}
  // short form for the browser tab, e.g. "Wed 28 Oct" or "Sat 31 Oct · Weekly Recap"
  function tabTitle(e){
    var dt = new Date(e.date+'T12:00:00');
    var d = isNaN(dt) ? e.date : dt.toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short'}).replace(',','');
    return d + (e.label ? ' · ' + e.label : '');
  }
  function state(title,msg){
    $('content').innerHTML='<div class="frame"><div class="state"><b>'+esc(title)+'</b><span>'+esc(msg||'')+'</span></div></div>';
  }
  function buildArchive(current){
    $('archList').innerHTML = editions.map(function(e){
      return '<a role="listitem" href="#'+key(e)+'"'+(key(e)===current?' class="current"':'')+'><span>'+esc(title(e))+'</span><small>'+esc(e.summary||'')+'</small></a>';
    }).join('');
  }
  function setNav(idx){
    var older = editions[idx+1], newer = editions[idx-1];
    $('prev').innerHTML = older ? '<a href="#'+key(older)+'">&larr; Older</a>' : '<span class="off">&larr; Older</span>';
    $('next').innerHTML = newer ? '<a href="#'+key(newer)+'">Newer &rarr;</a>' : '<span class="off">Newer &rarr;</span>';

    if(!mk) return null;
    var from = new Date(new Date(upto + 'T12:00:00') - 30 * 864e5).toISOString().slice(0, 10);
    var S = (MO[mk] || []).filter(function(w){ return w.session < upto && w.session > from; });
    if(S.length < 15 || S[0].session > new Date(new Date(upto + 'T12:00:00') - 25 * 864e5).toISOString().slice(0, 10)) return null;
    if(S[S.length - 1].session < new Date(new Date(upto + 'T12:00:00') - 4 * 864e5).toISOString().slice(0, 10)) return null;
    if(!S.every(function(w){ return w.series[k] && w.series[k].length > 1; })) return null;
    var pts = [];
    S.forEach(function(w){ var a = w.series[k]; a.forEach(function(p, j){ if(p[0].slice(3) === '00' || j === a.length - 1) pts.push({d: w.session.slice(5) + ' ' + p[0], v: p[1]}); }); });
    return pts;
  }
  function addSparks(upto, long){
    market.then(function(m){
      var from = new Date(new Date(upto+'T12:00:00') - 380 * 864e5).toISOString().slice(0,10);
      if(!m || !m.days || !m.days.length || m.days[0].date > from) return marketFull = marketFull || loadMarket('markets.json');
      return m;
    }).then(function(m){
      if(!m || !m.days) return;
      var days = m.days.filter(function(x){ return x.date <= upto; });
      if(!tickerSet){ tickerSet = {}; m.days.forEach(function(x){ Object.keys(x.egx||{}).concat(Object.keys(x.us||{})).forEach(function(k){ tickerSet[k] = 1; }); }); }
      monthP = monthP || fetch('desk/intraday.json', {cache:'no-cache'}).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){ return j && j.month; }).catch(function(){ return null; });
      return Promise.all([weekFor(upto), monthP]).then(function(R){ var WK = R[0], MO = R[1];
      document.querySelectorAll('#content .s-body table').forEach(function(table){
        if(table.querySelector('.trend')) return;
        var series = [].map.call(table.querySelectorAll('tbody tr'), function(tr){
          var cell = tr.querySelector('td'), pts = [];
          if(cell) days.forEach(function(x){ var v = pick(x, cell.textContent); if(typeof v === 'number') pts.push({d:x.date, v:v}); });
          return pts.length && pts[pts.length-1].d === upto ? pts : [];
        });
        // the week through each session, hour by hour, where the edition's snapshot has it (data/weeks/DATE.json)
        var weeks = [].map.call(table.querySelectorAll('tbody tr'), function(tr){ var c = tr.querySelector('td'); return !long && c ? weekPts(WK, c.textContent) : null; });
        var lines = series.map(function(pts, i){
          if(weeks[i] && pts.length) return spark(weeks[i], false, 'Last 5 sessions, hourly');
          pts = pts.slice(long ? -260 : -7);
          return pts.length >= 2 ? spark(pts, long) : '';
        });
        if(!lines.some(Boolean)) return;   // only tables with at least one trend line get the column
        var th = table.querySelector('thead th');
        if(th) th.insertAdjacentHTML('afterend', '<th class="trend">' + (long ? 'Last 12 months' : 'Last 7 days') + '</th>');
        [].forEach.call(table.querySelectorAll('tbody tr'), function(tr, i){
          var cell = tr.querySelector('td'); if(!cell) return;
          cell.insertAdjacentHTML('afterend', '<td class="trend" data-label="' + (long ? 'Last 12 months' : 'Last 7 days') + '">' + lines[i] + '</td>');
          if(lines[i]) tr.classList.add('has-trend'); if(lines[i] && long) tr.classList.add('trend-long');
        });
        var sec = table.closest('.s'), name = sec && sec.querySelector('h2') ? sec.querySelector('h2').textContent.trim() : '';
        var months = [].map.call(table.querySelectorAll('tbody tr'), function(tr){ var c = tr.querySelector('td'); return !long && c ? monthPts(MO, c.textContent, upto) : null; });
        if(!long && /^(Stocks Watch|Currency and Commodities Watch)$/.test(name)) addPeriods(table, series, upto, name !== 'Stocks Watch', weeks, months);
      });
      });
    });
  }

  // ---- change over 1D / 1W / 1M / 6M / 1Y: a switch above Stocks Watch and the currency table ----
  // The 1D figures in Stocks Watch are the run's own; every other figure is worked out from the data log,
  // and the trend line redraws over the same period.
  var PERIODS = [['1D',0,'Last 7 days'],['1W',7,'Last 7 days'],['1M',30,'Last 30 days'],['6M',182,'Last 6 months'],['1Y',365,'Last 12 months']];
  function cutoff(upto, back){ return new Date(new Date(upto+'T12:00:00') - back * 864e5).toISOString().slice(0,10); }
  function chgHtml(v, bold){
    if(v == null) return 'n/a';
    var up = v >= 0;
    return '<span class="chg ' + (up ? 'up' : 'down') + (bold && Math.abs(v) >= 5 ? ' big' : '') + '"><span aria-hidden="true">' + (up ? '▲' : '▼') + '</span> ' + (up ? '+' : '−') + Math.abs(v).toFixed(1) + '%</span>';
  }
  function periodChange(pts, upto, back){
    if(!pts.length) return null;
    var last = pts[pts.length-1].v, base = null;
    if(!back){ for(var i = pts.length-2; i >= 0; i--) if(pts[i].v !== last){ base = pts[i].v; break; } }
    else { var cut = cutoff(upto, back); for(var j = pts.length-1; j >= 0; j--) if(pts[j].d <= cut){ base = pts[j].v; break; } }
    return base ? (last / base - 1) * 100 : null;
  }
  function addPeriods(table, series, upto, addColumn, weeks, months){
    var heads = [].slice.call(table.querySelectorAll('thead th')), ci;
    if(addColumn){   // the currency table gets a Change column after Level
      var li = heads.findIndex(function(th){ return th.textContent.trim() === 'Level'; });
      if(li < 0) return;
      heads[li].insertAdjacentHTML('afterend', '<th class="num">Change</th>');
      [].forEach.call(table.querySelectorAll('tbody tr'), function(tr){ tr.children[li].insertAdjacentHTML('afterend', '<td class="num" data-label="Change"></td>'); });
      ci = li + 1;
    } else ci = heads.findIndex(function(th){ return th.textContent.trim() === 'Change'; });
    if(ci < 0) return;
    var rows = [].slice.call(table.querySelectorAll('tbody tr')), orig = rows.map(function(tr){ return tr.children[ci].innerHTML; });
    var head = table.querySelectorAll('thead th')[ci], trendHead = table.querySelector('th.trend');
    function apply(p){
      var label = p[0] === '1D' ? 'Change' : 'Change (' + p[0] + ')';
      head.textContent = label;
      if(trendHead) trendHead.textContent = p[2];
      rows.forEach(function(tr, i){
        var cell = tr.children[ci], pts = series[i] || [];
        if(p[0] === '1D' && !addColumn) cell.innerHTML = orig[i];
        else { var v = periodChange(pts, upto, p[1]); cell.innerHTML = chgHtml(v, p[0] === '1D'); cell.classList.toggle('na', v == null); }
        cell.setAttribute('data-label', label);
        var t = tr.querySelector('td.trend');
        if(t){
          var win = p[1] <= 7 ? pts.slice(-7) : pts.filter(function(x){ return x.d >= cutoff(upto, p[1]); });
          t.innerHTML = p[1] <= 7 && weeks && weeks[i] ? spark(weeks[i], false, 'Last 5 sessions, hourly') : p[1] === 30 && months && months[i] ? spark(months[i], false, 'Last 30 days, hourly') : win.length >= 2 ? spark(win, false, p[1] > 7 ? p[2] : null) : '';
          t.setAttribute('data-label', p[2]);
        }
      });
    }
    var bar = document.createElement('div');
    bar.className = 'pbar'; bar.setAttribute('role', 'group'); bar.setAttribute('aria-label', 'Change over');
    bar.innerHTML = '<span class="pbar-l">Change over</span>' + PERIODS.map(function(p, i){ return '<button type="button" aria-pressed="' + (i === 0) + '">' + p[0] + '</button>'; }).join('');
    [].forEach.call(bar.querySelectorAll('button'), function(b, i){
      b.addEventListener('click', function(){
        [].forEach.call(bar.querySelectorAll('button'), function(x){ x.setAttribute('aria-pressed', x === b); });
        apply(PERIODS[i]);
      });
    });
    table.closest('.tablewrap').insertAdjacentElement('beforebegin', bar);
    apply(PERIODS[0]);
  }

  // ---- search across every edition (loaded on first use) ----
  var pendingStory = null, corpus = null, current = null;
  function jumpTo(id){
    var el = document.getElementById(id);
    if(!el) return;
    el.scrollIntoView({block:'start'});
    el.classList.add('hit'); setTimeout(function(){el.classList.remove('hit')}, 2000);
  }
  function loadCorpus(){
    if(corpus) return corpus;
    corpus = Promise.all(editions.map(function(e){
      return fetch('editions/'+key(e)+'.md',{cache:'no-cache'}).then(function(r){return r.ok ? r.text() : ''}).then(function(md){
        var items = [], sec = '';
        md.split('\n').forEach(function(l){
          var h = l.match(/^##\s+(.*)$/);
          if(h){ sec = h[1].replace(/[*_`]/g,''); return; }
          var m = l.match(/^\s*(?:[-*]|\d+[.)])?\s*\*\*([^*]+?):?\*\*:?\s*(.*)$/);
          if(m && sec !== 'Today at a Glance' && sec !== 'Sources' && sec !== 'The Week in Brief')
            items.push({e:e, sec:sec, lead:m[1].replace(/:$/,'').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/[`_]/g,''), text:m[2].replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/[*_`]/g,'')});
        });
        return items;
      }).catch(function(){return []});
    })).then(function(all){return [].concat.apply([], all)});
    return corpus;
  }
  var searchSeq = 0;
  function search(q){
    var words = q.toLowerCase().split(/\s+/).filter(Boolean), seq = ++searchSeq;
    if(!words.length || q.trim().length < 2){ $('results').hidden = true; $('archList').hidden = false; return; }
    loadCorpus().then(function(items){
      if(seq !== searchSeq) return;
      var hits = items.filter(function(it){
        var hay = (it.lead+' '+it.text).toLowerCase();
        return words.every(function(w){return hay.indexOf(w) >= 0});
      }).slice(0, 40);
      $('results').innerHTML = hits.length ? hits.map(function(it){
        var t = it.text.length > 160 ? it.text.slice(0,157)+'…' : it.text;
        return '<a role="listitem" href="#'+key(it.e)+'" data-story="story-'+slug(it.lead)+'"><span>'+esc(it.lead)+'<small class="where">'+esc(title(it.e)+' · '+it.sec)+'</small></span><small>'+esc(t)+'</small></a>';
      }).join('') : '<p class="none">No stories match.</p>';
      $('results').hidden = false; $('archList').hidden = true;
    });
  }
  var qTimer;
  $('q').addEventListener('input',function(){ var v = this.value; clearTimeout(qTimer); qTimer = setTimeout(function(){search(v)}, 200); });
  $('results').addEventListener('click',function(ev){
    var a = ev.target.closest('a[data-story]');
    if(!a) return;
    var k = a.getAttribute('href').slice(1);
    if(k === current){ ev.preventDefault(); $('archive').classList.remove('open'); $('archiveBtn').setAttribute('aria-expanded','false'); jumpTo(a.getAttribute('data-story')); }
    else pendingStory = a.getAttribute('data-story');
  });

  $('archiveBtn').addEventListener('click',function(){
    var open = $('archive').classList.toggle('open');
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  window.addEventListener('hashchange',function(){
    var h = (location.hash||'').replace('#','');
    if(!editions.length) return;
    if(/^\d{4}-\d{2}-\d{2}(-[a-z0-9]+)?$/.test(h) || h === 'topics' || h.indexOf('topic/') === 0) show();   // section links are plain in-page anchors
  });

  fetch('editions/index.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(data){
    editions = (data.editions||[]).slice().sort(function(a,b){return key(a)<key(b)?1:-1});
    if(!editions.length){
      state('The first edition is on its way','New editions are added every day.');
      return;
    }
    $('top').hidden = false;
    // a refresh always opens the newest edition; a shared link to a dated edition still opens that one
    var nav = window.performance && performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
    if(nav && nav.type === 'reload' && /^#\d{4}-/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
    show();
  }).catch(function(){state('Could not load the newsletter','Please try again in a moment.')});
})();
</script>
